---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, type-check, boundaries, tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so contract-sync can diff against the base

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install UV
        # Pinned to an exact release: astral-sh stopped publishing a floating
        # major tag after v7, so `@v9` does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Cache the embedding model
        # fastembed is a hard dependency and the default embedder, so the test
        # suite exercises the real model. The weights are ~64 MB and never
        # change for a pinned model name — download them once, not every run.
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Dead-code scan (vulture)
        run: uv run vulture

      - name: Module boundaries (tach)
        run: uv run tach check

      - name: Contract sync (api.* <-> CONTRACT.md)
        run: uv run python scripts/check_contract_sync.py

      - name: Tests + coverage
        run: uv run pytest --cov=docir --cov-fail-under=90

      - name: Document integrity (docir check --strict)
        # The merge-into-main guard: --strict exits 1 on `error` findings only —
        # duplicate ids and dangling edges, which is exactly what a branch merge
        # introduces. Warnings (orphan, cycle, layering, staleness) do not fail
        # the build; `orphan` fires for every document with no relations, so
        # gating on them would fail a healthy corpus.
        #
        # Announce the skip rather than passing silently: until the project
        # store is committed there is nothing to check, and a gate that always
        # exits 0 reads as "the corpus is clean" when it means "nothing ran".
        run: |
          if [ ! -d .docir/docs ]; then
            echo "::notice::no committed .docir store — document integrity gate did not run"
            exit 0
          fi
          uv run docir --no-daemon check --strict
