---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, type-check, boundaries, tests
    runs-on: ubuntu-latest

    env:
      # Where fastembed puts the model, pinned so the cache step below can name
      # the same directory. Without it fastembed 0.8 resolves its cache to
      # `tempfile.gettempdir()/fastembed_cache` — NOT `~/.cache/fastembed`,
      # which the cache step used to name — so the key never hit, the post-step
      # had nothing to save, and every run re-downloaded ~64 MB while the step
      # claimed it was downloading them once.
      #
      # A plain literal on both sides, and deliberately so. It may not be
      # `~/.cache/fastembed`: a job-level `env:` value is not shell-expanded, so
      # a literal `~` would have fastembed create a directory actually named
      # `~`, while `actions/cache` *does* expand `~` in its `path:` — one side
      # expanding and the other not is how they came to name different
      # directories. And it may not be `${{ runner.temp }}` either: the `runner`
      # context is not available in a job-level `env:` (only github / needs /
      # strategy / matrix / vars / inputs are), which is a workflow-file error,
      # so the whole run fails before a single job starts. A literal needs
      # neither rule to be remembered.
      FASTEMBED_CACHE_PATH: /tmp/fastembed-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so contract-sync can diff against the base

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install UV
        # Pinned to an exact release: astral-sh stopped publishing a floating
        # major tag after v7, so `@v9` does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Cache the embedding model
        # fastembed is a hard dependency and the default embedder, so the test
        # suite exercises the real model. The weights are ~64 MB and never
        # change for a pinned model name — download them once, not every run.
        # The path is FASTEMBED_CACHE_PATH above, spelled identically; see
        # there for why it is a literal and not `~/.cache/fastembed`.
        uses: actions/cache@v6
        with:
          path: /tmp/fastembed-cache
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Workflow lint (actionlint)
        # The one file in this repo that cannot be validated by running it.
        # Parsing as YAML is a far weaker claim than "GitHub accepts it", and
        # the gap between them is where a job-level `env:` using the `runner`
        # context slipped through: GitHub rejected the file outright, so zero
        # jobs ran and the failure said only "workflow file issue". actionlint
        # names the line and the rule. Runs here *and* locally — `uv run
        # actionlint` — because a gate that only fires after a push cannot stop
        # the push that turns main red.
        run: uv run actionlint

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Dead-code scan (vulture)
        run: uv run vulture

      - name: Module boundaries (tach)
        run: uv run tach check

      - name: Contract sync (api.* <-> CONTRACT.md)
        run: uv run python scripts/check_contract_sync.py

      - name: Tests + coverage
        run: uv run pytest --cov=docir --cov-fail-under=90

      - name: Build the index the document gates read
        # `.docir/docs/` is committed and the derived index is gitignored, so a
        # checkout has NO index at all — and `check` reads the index. Without
        # this step the gate below ran over zero documents and printed "no
        # structural issues", which is the failure its own comment warns about:
        # a gate that always exits 0 reads as "the corpus is clean" when it
        # means "nothing ran". The file-scanning half (duplicate ids, malformed
        # files) still fired; `dangling` — the other half of the merge guard —
        # never did. Same reason pages.yml reindexes before it builds.
        run: |
          if [ ! -d .docir/docs ]; then exit 0; fi
          uv run docir --no-daemon reindex

      - name: Store health (docir doctor --strict)
        # Proves the rebuild above actually populated the index, before the gate
        # below trusts it. --strict exits 1 on `error` findings only: no index,
        # an index holding nothing beside files on disk, a schema that will not
        # load, an absent embedder. The warnings it also reports (a stale build
        # stamp, schema drift, a pending embedding queue) never fail the build —
        # every store is in one of those states between an upgrade and its next
        # rebuild.
        #
        # One command, not a report followed by a gate: doctor emits the whole
        # report *before* --strict exits, so a second run would only rebuild the
        # container to print what the first already printed. `--pretty` is what
        # makes it a table in the log rather than piped JSON.
        run: |
          if [ ! -d .docir/docs ]; then exit 0; fi
          uv run docir --no-daemon --pretty doctor --strict

      - name: Document integrity (docir check --strict)
        # The merge-into-main guard: --strict exits 1 on `error` findings only —
        # duplicate ids and dangling edges, which is exactly what a branch merge
        # introduces. Warnings (orphan, cycle, layering, staleness) do not fail
        # the build; `orphan` fires for every document with no relations, so
        # gating on them would fail a healthy corpus.
        #
        # Announce the skip rather than passing silently: until the project
        # store is committed there is nothing to check, and a gate that always
        # exits 0 reads as "the corpus is clean" when it means "nothing ran".
        run: |
          if [ ! -d .docir/docs ]; then
            echo "::notice::no committed .docir store — document integrity gate did not run"
            exit 0
          fi
          uv run docir --no-daemon check --strict

      - name: Decisions this branch touches (notice, never a gate)
        # The review-time half of code linkage (adr-b2cfed9d5888): print the
        # decisions that declared they govern the files this PR changes, so a
        # reviewer is told what to read against. Deliberately not a gate —
        # failing because you touched governed code punishes the ordinary case,
        # and a check cleared by clicking is a ritual, not a human reading a
        # decision. `|| true` keeps a docir failure from failing the build for
        # the same reason.
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -d .docir/docs ]; then exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | head -100)
          if [ -z "$files" ]; then exit 0; fi
          args=()
          while IFS= read -r file; do args+=(--code "$file"); done <<< "$files"
          uv run docir --no-daemon --pretty query "${args[@]}" --limit 20 || true
