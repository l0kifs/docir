# Actor catalog — who or what drives docir.
# confidence: observed = read from code/tests; inferred = reasoned from design; assumed = neither.

- id: ACT-001
  name: AI coding agent
  type: system
  goal: >
    Before writing code, obtain the design decisions/issues/architecture notes relevant
    to the current task, cheaply enough to afford doing it every session.
  authority: >
    Full write authority — may add, update, archive, delete any document and mutate the
    tag registry. No permission model exists (ADR-0003), so it can do anything a human can.
  frequency: "every coding session; the primary caller"
  flows: [FLOW-001, FLOW-002, FLOW-005]
  evidence:
    - README.md:8
    - src/docir/entry_points/cli/rendering.py:1-9      # JSON path exists for this actor
    - src/docir/modules/agents/infra/templates/skill.md
    - src/docir/modules/documents/application/dto.py:86-91
  confidence: observed
  notes: >
    The token-trimming, the skeleton read contract and the JSON `--help` all exist only
    for this actor. It is the design centre of the product.

- id: ACT-002
  name: repository maintainer / developer
  type: human
  goal: >
    Capture a decision once, in the repo, and have it resurface when it becomes relevant —
    without maintaining a wiki.
  authority: "Unrestricted. Also the only actor who can edit markdown files directly."
  frequency: "at decision points; bursty, low volume"
  flows: [FLOW-001, FLOW-002, FLOW-003, FLOW-004, FLOW-005, FLOW-006]
  evidence:
    - README.md:50-68
    - src/docir/entry_points/cli/rendering.py:21        # Rich tables exist for this actor
  confidence: observed

- id: ACT-003
  name: CI job
  type: scheduler
  goal: "Block a merge that would corrupt the document graph (duplicate ids, dangling refs)."
  authority: "Read-only; signals via exit code only."
  frequency: "per pull request"
  flows: [FLOW-003]
  evidence:
    - src/docir/entry_points/cli/app.py:419-440
    - CLAUDE.md                                          # '`docir check --strict` exits 1 for CI'
  confidence: observed
  notes: >
    This actor is asserted by the docs but has NO fixture, example workflow, or template
    anywhere in the repo — `.github/workflows/` runs the project's own tests, not `docir
    check`. Its requirements are therefore inferred, and they are not met (GAP-006).

- id: ACT-004
  name: embedding scheduler
  type: scheduler
  goal: "Bring semantic vectors up to date after content changes, off the write path."
  authority: "May recompute or drop any embedding row. Cannot alter documents."
  frequency: "debounced 2s after any content write (daemon); inline otherwise"
  flows: [FLOW-001, FLOW-002]
  evidence:
    - src/docir/modules/indexing/infra/scheduler.py:27-44
    - src/docir/modules/indexing/infra/scheduler.py:105-115
  confidence: observed

- id: ACT-005
  name: docir daemon
  type: system
  goal: "Keep the embedding model warm and serialize writes into the store."
  authority: "Executes every command on behalf of a client; self-terminates when idle."
  frequency: "continuous while in use; exits after 900s idle"
  flows: [FLOW-001, FLOW-002, FLOW-004]
  evidence:
    - src/docir/platform/transport/server.py:20-49
    - src/docir/config/settings.py:29
  confidence: observed
  notes: >
    Load-bearing far beyond its stated role: it is the *only* thing that makes concurrent
    id allocation safe (PROBE-10 vs PROBE-11). The docs attribute that safety to the
    SequenceRow counter instead. See GAP-009.

- id: ACT-006
  name: git / branch merge
  type: external_partner
  goal: "Integrate two developers' documents into one history."
  authority: "Can create any file state, including two files with the same id."
  frequency: "per merge"
  flows: [FLOW-003]
  evidence:
    - src/docir/modules/documents/application/services/maintenance_service.py:84-124
    - tests/modules/documents/test_merge_safety.py
  confidence: observed
  notes: >
    A genuine non-human actor: the duplicate-id file scan exists solely because git can
    produce a state no docir command would.

# --- Actors that are ABSENT and arguably should exist -------------------------
# Recorded here because their absence is itself a finding, not because they were found.

- id: ACT-007
  name: document owner / steward
  type: human
  goal: "Re-verify that a document is still true when its review cadence elapses."
  authority: "None modelled — `owner` is a free-form string with no behaviour attached."
  frequency: "per review cadence (365d for decision/architecture, 180d for qa/ops)"
  flows: [FLOW-003]
  evidence:
    - src/docir/modules/documents/domain/entities/document.py:37
    - src/docir/modules/documents/domain/services/graph_checks.py:100-102
  confidence: observed
  notes: >
    The staleness feature names this actor but never reaches them: `owner` is only ever
    interpolated into a `check` message. No notification, no queue, no "my documents"
    filter. The actor exists in the data model and nowhere in the flows. See GAP-011.

- id: ACT-008
  name: support / operator recovering a broken store
  type: human
  goal: "Diagnose and repair a store that has duplicate ids, dangling refs, or a lost doc."
  authority: "Unmodelled."
  frequency: "unknown — no data"
  flows: [FLOW-003]
  evidence: []
  confidence: assumed
  notes: >
    NO actor of this kind is served. `docir check` reports duplicate-id and dangling
    findings but there is no `docir repair`, no `--fix`, no runbook, and no documented
    manual procedure. Every failure mode this analysis confirmed leaves the user here
    with no tool. See GAP-012.
