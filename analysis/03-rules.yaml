- id: BR-001
  statement: >
    When a document is created, the system shall reject the write unless every
    supplied tag key is already present in the tag registry.
  pattern: unwanted
  flow: FLOW-001
  actor: AI coding agent
  evidence: [src/docir/modules/documents/domain/services/validation.py:51-59,
             src/docir/modules/documents/application/services/document_service.py:98]
  confidence: observed
  status: assumed
  owner: repo maintainer
  examples:
    - given: "registry contains {auth}"
      when: "add --tags auth,security"
      then: "rejected, UnknownTagError, exit 2; nothing written"
  boundaries: ["empty tag list (allowed)", "tag registered in the same transaction"]
  open_questions: []

- id: BR-002
  statement: >
