             The same document is correctly hidden by `search` and `query`."
  open_questions: [Q-005]

- id: BR-030
  statement: >
    When ranked context is returned, the system shall additionally include every document
    reachable in one hop along the selected documents' outgoing edges.
  pattern: event
  flow: FLOW-002
  evidence: [src/docir/modules/documents/application/services/document_service.py:297-307]
  confidence: observed
  status: assumed
  owner: repo maintainer
  notes: >
    Applied AFTER the limit is enforced and itself uncapped, so `--limit N` does not bound
    the response. OBSERVED: --limit 3 returned 9. Incoming edges are never followed, so
    "what superseded this?" is not answerable from the superseded document. → GAP-005, GAP-019.
  examples:
    - given: "3 decisions each with 2 outgoing edges, all ranking above the cut"
      when: "docir context 'cache invalidation policy' --limit 3"
      then: "OBSERVED: 9 documents returned"
  open_questions: [Q-003]

- id: BR-031
  statement: >
    The system shall always return the requested number of context results when the corpus
    is non-empty, regardless of how well any document matches.
  pattern: ubiquitous
  flow: FLOW-002
  evidence: [src/docir/modules/indexing/domain/scoring.py:36-42,
             src/docir/modules/documents/application/services/document_service.py:257]
  confidence: observed
  status: assumed
  owner: repo maintainer
  notes: >
    An emergent rule nobody wrote: every active vector is ranked, so the fused list is never
    empty and there is no similarity floor. "Nothing relevant" is not an expressible answer.
  examples:
    - given: "a store containing only 'Postgres connection pooling'"
      when: "docir context 'how do I bake sourdough bread' --limit 3"
      then: "OBSERVED: returns the Postgres decision, score 0.0328"
  open_questions: [Q-009]

- id: BR-032
  statement: >
    When free text is searched, the system shall match documents containing ANY of the query
    terms.
  pattern: event
  flow: FLOW-002
  evidence: [src/docir/platform/persistence/repositories.py:352-357]
  confidence: observed
  status: assumed
  owner: repo maintainer
  notes: >
    OR-of-terms, not AND, and not a phrase. A three-word query matches a document sharing one
    common word. Undocumented; `docir search` is presented as plain "full-text search". Also
    means punctuation-only or stopword-only queries return nothing at all (empty MATCH).
  boundaries: ["empty query → no results, not an error", "query of only punctuation → no results"]

- id: BR-033
  statement: >
    While a document's type declares a review cadence, the system shall report it as stale
    once more days have elapsed since its last verification (or last edit, if never verified)
    than the cadence allows.
  pattern: state
  flow: FLOW-002
  evidence: [src/docir/modules/documents/domain/services/graph_checks.py:84-111,
             src/docir/modules/documents/domain/entities/document.py:73-75,
             docs/adr/ADR-0006-staleness-as-data.md]
  confidence: observed
  status: assumed
  owner: repo maintainer
  boundaries: ["exactly at cadence → NOT stale (strict >)", "cadence 0 → never stale",
               "archived → never stale", "unknown type → never stale"]
  notes: "Falling back to `updated` means any edit — including an administrative tag rename —
          resets the clock. → GAP-020."

- id: BR-034
  statement: >
    When output is captured (stdout is not a terminal) or `--json` is given, the system shall
    emit compact JSON with information-free fields omitted; at a terminal it shall render
    tables.
  pattern: complex
  flow: FLOW-002
  actor: AI coding agent
  evidence: [src/docir/entry_points/cli/rendering.py:27-57, README.md:85-95]
  confidence: observed
  status: assumed
  owner: repo maintainer
  decision_table:
    conditions: [pretty_flag, json_flag, stdout_is_tty, no_trim_flag]
    rows:
      - "[true,  any,   any,   any]   -> rich tables"  # --pretty wins outright
      - "[false, true,  any,   false] -> compact trimmed JSON"
      - "[false, true,  any,   true]  -> compact full JSON"
      - "[false, false, true,  any]   -> rich tables"
      - "[false, false, false, false] -> compact trimmed JSON"  # the agent default
      - "[false, false, false, true]  -> compact full JSON"
    notes: >
      --no-trim has no effect on the table path. Precedence is identical for --help, which is
      resolved from argv because Click renders it before CliState exists (runner.py:51-66).
  notes: "An omitted key always means the field's default, never a real zero or false."

