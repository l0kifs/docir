- id: BR-005
  statement: >
    While a document is at status S, when a change to status T is requested, the system
    shall permit it only if T is reachable from S in the type's transition map, unless the
    caller passes `--override`, in which case only T's membership in the status enum is checked.
  pattern: complex
  flow: FLOW-001
  evidence: [src/docir/modules/documents/application/services/document_service.py:324-329,
             src/docir/modules/documents/domain/schema.py:66-70]
  confidence: observed
  status: assumed
  owner: repo maintainer
  decision_table:
    conditions: [target_in_enum, transition_declared, override_flag]
    rows:
      - "[false, any,   false] -> reject:InvalidStatusError"
      - "[false, any,   true]  -> reject:InvalidStatusError"
      - "[true,  true,  any]   -> allow"
      - "[true,  false, false] -> reject:InvalidStatusTransitionError"
      - "[true,  false, true]  -> allow, UNAUDITED"  # → GAP-014
      - "[S == T, any,  any]   -> allow (self-loop always permitted)"
  examples:
    - given: "decision at 'rejected' (a terminal status)"
      when: "update --status accepted --override"
      then: "allowed; the document is now 'accepted' with no record that a rule was bypassed"
  open_questions: [Q-014]

- id: BR-006
  statement: >
    The system shall allocate every document id itself and shall never accept a
    caller-supplied id: a `sequential` type draws from a per-prefix counter in the index, a
    `random` type mints a hex token and retries on collision.
  pattern: complex
  flow: FLOW-001
  evidence: [src/docir/modules/documents/application/services/id_generator.py:26-48,
             src/docir/platform/persistence/repositories.py:48-66,
             src/docir/modules/documents/domain/value_objects/identifiers.py:40-48]
  confidence: observed
  status: confirmed       # the maintainer authorised and directed the fixes; behaviour re-verified
  owner: repo maintainer
  notes: >
    Restated 2026-07-26. The original wording ("from a per-prefix counter") described only
    the sequential path and read as though the counter were the sole mechanism — which is
    what made BR-007's uniqueness claim look safe when it was not.
  open_questions: []

- id: BR-007
  statement: >
    The system shall issue a unique id to each document.
  pattern: ubiquitous
  flow: FLOW-001
  evidence: [CLAUDE.md, src/docir/modules/documents/application/services/id_generator.py:3-5]
  confidence: observed
  status: confirmed
  owner: repo maintainer
  notes: >
    RESOLVED 2026-07-26 — held now, was not when first written. Both violations are fixed
    (GAP-003, GAP-009) and `docir init` defaults to `id_style: random`, which removes the
    counter from the picture entirely for new stores. Original finding, kept for the record:
    CLAUDE.md said "Ids are allocated from the DB counter (SequenceRow),
    never by scanning files — that is what keeps parallel agents from minting the same id."
    Two confirmed violations:
      (a) --no-daemon concurrency: 6 simultaneous adds all returned adr-0002 (GAP-009);
      (b) reindex loses the counter, so the next add re-mints a live id (GAP-003).
    Uniqueness is actually provided by the daemon's single-connection serialization plus a
    counter that survives, not by the counter itself.
  examples:
    - given: "a store with adr-0001, adr-0002 on disk and no index (fresh clone)"
      when: "docir reindex && docir add --type decision --title 'Third'"
      then: "OBSERVED: the new document is issued adr-0001; adr-0001 'First' becomes
             invisible to get/query/search/context while its file remains on disk"
  open_questions: [Q-001, Q-002]

- id: BR-008
  statement: >
