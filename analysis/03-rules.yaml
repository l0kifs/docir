             src/docir/modules/documents/domain/schema.py:34-42]
  confidence: observed
  status: confirmed
  owner: repo maintainer
  boundaries: ["no id_style anywhere -> DEFAULT_ID_STYLE (sequential), so a pre-existing
                docs-schema.yaml keeps minting the ids it always did",
               "schema-wide random + per-type sequential -> that one type stays sequential",
               "unknown value -> SchemaError at load, exit 3"]
  notes: >
