  evidence: [src/docir/modules/documents/domain/services/graph_checks.py:194-223,
             src/docir/modules/documents/domain/services/graph_checks.py:26]
  confidence: observed
  status: disputed
  owner: repo maintainer
  notes: >
    In the default `software` profile decision=3 and issue=1, so linking a decision to the
    issue that motivated it — the pairing in the README's own example output — is a permanent
    violation. Either the levels, the exempt-kind list, or the rule is wrong.
  examples:
    - given: "software profile; adr-0001 related: [issue-0003]"
      when: "docir check"
      then: "OBSERVED: layering violation: decision 'adr-0001' depends on lower-level issue"
  open_questions: [Q-006]

- id: BR-046
  statement: >
    When advisory linting is requested with `--deep`, the system shall report document pairs
