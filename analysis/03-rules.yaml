- id: BR-074
  statement: >
    When a store is initialised, the system shall write a collision-resistant `random`
    id style unless the caller asks for `sequential`.
  pattern: event
  flow: FLOW-004
  evidence: [src/docir/entry_points/composition.py:50-56,
             src/docir/entry_points/cli/app.py:95-140]
  confidence: observed
  status: confirmed
  owner: repo maintainer
  examples:
