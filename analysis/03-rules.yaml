- id: BR-003
  statement: >
    Where the schema registers relation kinds, when an edge is written, the system shall
    reject any edge whose kind is not registered, and any edge whose kind or target type
    is outside the source type's `allowed_relations` whitelist.
  pattern: complex
  flow: FLOW-001
  actor: AI coding agent
  evidence: [src/docir/modules/documents/domain/services/validation.py:68-93,
             src/docir/modules/documents/domain/schema.py:72-84]
  confidence: observed
  status: assumed
  owner: repo maintainer
  decision_table:
    conditions: [relation_types_registry, kind_registered, allowed_relations_for_type, target_type_listed]
    rows:
      - "[empty,     any,   any,        any]   -> allow"  # permissive default (pre-typed-edge schemas)
      - "[non-empty, false, any,        any]   -> reject:UnknownRelationKindError"
      - "[non-empty, true,  empty,      any]   -> allow"  # type unconstrained
      - "[non-empty, true,  kind absent, any]  -> reject:DisallowedRelationError"
      - "[non-empty, true,  kind present, empty list] -> allow"  # any target type
      - "[non-empty, true,  kind present, listed]     -> allow"
      - "[non-empty, true,  kind present, not listed] -> reject:DisallowedRelationError"
      - "[non-empty, true,  kind present, target id unknown to index] -> allow"  # skipped; BR-002 already ran
  examples:
    - given: "legal profile; obligation type; allowed_relations.implements = [policy, contract]"
      when: "add --type obligation --related obl-0002:implements"
      then: "rejected — an obligation may not `implements` another obligation"
  open_questions: []

