- id: BR-025
  statement: >
    When ranked context is requested, the system shall combine a full-text ranking with a
    semantic ranking by reciprocal rank fusion and order results by the fused score.
  pattern: event
  flow: FLOW-002
  actor: AI coding agent
  evidence: [src/docir/modules/indexing/domain/scoring.py:44-73,
             src/docir/modules/documents/application/services/document_service.py:256-258]
  confidence: observed
  status: assumed
  owner: repo maintainer
  notes: >
    RRF is rank-based, so the emitted `score` carries no absolute meaning and is not
    comparable across queries. It is published in the README's agent-facing example
    (README:90) with no interpretation given. → GAP-017.

- id: BR-026
  statement: >
    The system shall consider at most 25 full-text candidates when fusing rankings.
  pattern: ubiquitous
