- id: BR-041
  statement: >
    When the index is rebuilt, the system shall reconstruct it from the markdown files and
    the tag registry file, which are canonical.
  pattern: event
  flow: FLOW-003
  evidence: [src/docir/modules/documents/application/services/maintenance_service.py:58-69,
             README.md:34]
  confidence: observed
  status: disputed
  owner: repo maintainer
  notes: >
    INCOMPLETE. `id_sequences` is part of the index and is not reconstructed, so the rebuild
    is not faithful. This is the mechanism behind GAP-003. Also: malformed files are skipped
    silently and not counted (GAP-022); `--changed` skips the removal sweep so deleted files
    stay indexed (GAP-021).
  open_questions: [Q-001]

- id: BR-042
  statement: >
    When structural checks run, the system shall report unknown types, dangling references,
    relation cycles, orphans, layering violations, staleness, duplicate ids and malformed
    files as non-blocking findings.
  pattern: event
  flow: FLOW-003
  actor: CI job
  evidence: [src/docir/modules/documents/domain/services/graph_checks.py:44-58,
             src/docir/modules/documents/application/services/maintenance_service.py:84-124]
  confidence: observed
  status: assumed
  owner: repo maintainer

- id: BR-043
  statement: >
    If `--strict` is given and any finding of any kind exists, then the system shall exit
    with code 1.
  pattern: unwanted
  flow: FLOW-003
  actor: CI job
  evidence: [src/docir/entry_points/cli/app.py:439-440]
  confidence: observed
  status: disputed
  owner: repo maintainer
  notes: >
    All eight finding kinds are equal. `orphan` fires for any document with no relations —
    the default state of a new document — so the gate fails on a healthy corpus. There is no
    severity, no kind selection and no ignore mechanism, so the only way to keep CI green is
    to abandon the gate, which also abandons duplicate-id detection: the gate's stated purpose.
  examples:
    - given: "a fresh store with two unrelated documents and no other problems"
      when: "docir check --strict"
      then: "OBSERVED: exit 1, from two `orphan` findings"
  open_questions: [Q-004]

- id: BR-044
  statement: >
    When duplicate ids are looked for, the system shall scan the markdown files directly
    rather than the index, because the index deduplicates by primary key.
  pattern: event
  flow: FLOW-003
  actor: git / branch merge
  evidence: [src/docir/modules/documents/application/services/maintenance_service.py:109-124]
  confidence: observed
  status: assumed
  owner: repo maintainer
  notes: >
    Correct and load-bearing. Note what it implies: when two files share an id the index
    silently keeps one and drops the other, so the other document is invisible to every read
    path while its file still exists. That is the actual damage in GAP-003 and GAP-009.

- id: BR-045
  statement: >
    While a relation points from a higher-level type to a lower-level one and its kind is
