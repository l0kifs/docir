# Glossary — one term, one definition, one owner.
# Synonyms and homonyms are findings, not tidy-ups.

- term: document
  definition: >
    One markdown file with YAML frontmatter, identified by a type-prefixed id, and the unit
    of everything docir does: validation, retrieval, relation, staleness.
  owner: repo maintainer
  used_in: [documents, indexing, tags, CLI]
  evidence: [src/docir/modules/documents/domain/entities/document.py:19-38]

- term: index
  definition: >
    The derived SQLite projection of the documents — metadata, FTS5 full text, relation
    graph, embedding vectors and the id counter. Gitignored and rebuildable.
  owner: repo maintainer
  used_in: [platform.persistence, documents, indexing]
  evidence: [README.md:20-35, src/docir/platform/persistence/alembic/versions/0001_initial_index.py]
  conflicts:
    - context: the "rebuildable" claim
      definition: >
        "Rebuildable" is true of six of the seven tables. `id_sequences` is part of the index
        by every structural definition (it lives in the index database, is created by the
        index migration, is gitignored) but is NOT reconstructed by `reindex`. The word
        "derived" is doing work it cannot support for that one table, and the consequence is
        GAP-003.
      gap: GAP-003

- term: stale
  definition: >
    OVERLOADED — three unrelated meanings in one codebase:
      (1) a document past its type's review cadence (the product feature, ADR-0006);
      (2) an index row whose file changed out-of-band (`StaleWriteError`, the concurrency
          guard);
      (3) an index row for a file that no longer exists (`for stale in uow.documents.all()`
          in the reindex removal sweep).
  owner: repo maintainer
  used_in: [documents.domain, documents.application, platform.errors]
  evidence:
    - src/docir/modules/documents/domain/services/graph_checks.py:84       # sense 1
    - src/docir/platform/errors/__init__.py:101-104                        # sense 2
    - src/docir/modules/documents/application/services/document_service.py:136  # sense 2
    - src/docir/modules/documents/application/services/maintenance_service.py:168  # sense 3
  conflicts:
    - context: "document_service.update()"
      definition: >
        The local variable `stale` (sense 2) sits eleven lines from `self._is_stale(...)`
        (sense 1) in the same method. Both are booleans about the same document and they mean
        entirely different things.
      gap: GAP-032

- term: archived
  definition: >
    A document withdrawn from retrieval but kept on disk and in the metadata table. Set by
    `docir archive`; reversible.
  owner: repo maintainer
  used_in: [documents, indexing]
  evidence: [src/docir/modules/documents/application/services/document_service.py:161-188]
  conflicts:
    - context: "inactive status"
      definition: >
        `inactive_statuses` (e.g. `resolved`, `superseded`, `deprecated`) also withdraws a
        document from the list read paths. Two independent mechanisms with near-identical
        user-visible effect, different flags to defeat (`--include-archived` vs
        `--include-resolved`), and different enforcement points — which is why one of them
        leaks through graph expansion and the other does not.
      gap: GAP-004

- term: resolved
  definition: >
    In the CLI: the flag name `--include-resolved` for "also show documents in an inactive
    status" — on every type, including ones with no status called `resolved`.
  owner: repo maintainer
  used_in: [CLI, documents.application]
  evidence: [src/docir/entry_points/cli/app.py:269, 288, 303,
             src/docir/entry_points/dispatch.py:116]
  conflicts:
    - context: "the schema"
      definition: >
        `resolved` is a status of exactly two types (`issue` in the software profile,
        `incident` in ops). For a `decision` the flag means "include rejected and superseded";
        for a `policy`, "include superseded and retired". The wire field is named
        `include_inactive` — correctly — and the CLI renames it to something narrower on the
        way out. A user asking for decisions cannot guess that `--include-resolved` is the
        flag they need.
      gap: GAP-033

- term: related
  definition: "The outgoing typed edges of a document (`RelatedRef{target, kind}`)."
  owner: repo maintainer
  used_in: [documents.domain, platform.persistence, frontmatter]
  evidence: [src/docir/modules/documents/domain/value_objects/relations.py]
  conflicts:
    - context: "on disk vs in the API"
      definition: >
        In frontmatter an entry is either a bare id or `{to: <id>, kind: <k>}`. In JSON output
        the same edge is `{target: <id>, kind: <k>}`. The key is `to` in one representation
        and `target` in the other, for the same field of the same object.
      gap: GAP-034

- term: level
  definition: >
    A per-type integer expressing architectural abstraction height; a dependency edge from a
    higher level to a lower one is reported as a layering violation.
  owner: repo maintainer
  used_in: [documents.domain.schema, graph_checks]
  evidence: [src/docir/modules/documents/domain/schema.py:46-47,
             src/docir/modules/documents/domain/services/graph_checks.py:194-223]
  conflicts:
    - context: "the shipped software profile"
      definition: >
        The levels assigned (decision 3, issue 1) make the ordinary and intended relationship
        "this decision addresses that issue" a violation. The term's definition and the
        shipped values disagree about what the ordering means.
      gap: GAP-008

- term: check / lint
  definition: >
    `check` = Tier 1, structural, non-blocking-but-CI-gateable. `lint --deep` = Tier 2,
    advisory heuristics.
  owner: repo maintainer
  used_in: [CLI, documents.application]
  evidence: [src/docir/entry_points/cli/app.py:419-456, CLAUDE.md]
  conflicts:
    - context: "`--strict`"
      definition: >
        `check` is documented as producing "warnings rather than failing an agent mid-task"
        (graph_checks.py:3-5), yet `--strict` turns every one of them into a build failure
        with no severity distinction. The tier model says these are warnings; the CI
        integration treats them as errors.
      gap: GAP-006

- term: score
  definition: "The reciprocal-rank-fusion value for a context result."
  owner: repo maintainer
  used_in: [indexing.domain, CLI output, README]
  evidence: [src/docir/modules/indexing/domain/scoring.py:44-73, README.md:90-95]
  conflicts:
    - context: "what a reader will assume"
      definition: >
        Published as a bare number in agent-facing JSON, where it reads as a relevance
        measure. It is a rank-position artefact: bounded near 1/(k+1)+1/(k+1) ≈ 0.033,
        essentially identical for a perfect match and a nonsense query. README:95 says
        "ordering is the point", which is correct — but the value is still emitted, and
        nothing prevents an agent thresholding on it.
      gap: GAP-017

- term: home / store
  definition: "The single resolved directory holding docs/, docs-schema.yaml and the index."
  owner: repo maintainer
  used_in: [config, CLI, docs]
  evidence: [src/docir/config/settings.py:51-104]
  conflicts:
    - context: "naming"
      definition: >
        Called "home" in code and `--home`/`DOCIR_HOME`, "store" in the CLI help and ADR-0009,
        and "data root" in the `--home` option help — three names for one concept in
        user-facing text.
      gap: GAP-035

- term: profile
  definition: "A named bundle of document types layered onto the frozen core schema."
  owner: repo maintainer
  used_in: [documents.infra, CLI]
  evidence: [src/docir/modules/documents/infra/profiles.py:41-208]

- term: skeleton
  definition: >
    A `DocumentSummary`: frontmatter, typed edges and staleness, with no body. The unit the
    list read paths return and the source of the token savings.
  owner: repo maintainer
  used_in: [documents.application, README]
  evidence: [src/docir/modules/documents/application/dto.py:84-108]

- term: owner
  definition: "A free-form string naming who is accountable for re-verifying a document."
  owner: repo maintainer
  used_in: [documents.domain, graph_checks]
  evidence: [src/docir/modules/documents/domain/entities/document.py:37]
  conflicts:
    - context: "what the word implies vs what it does"
      definition: >
        The word implies an accountable party. The field is written, stored, and interpolated
        into one `check` message — nothing else. It cannot be queried or filtered on, triggers
        no notification, and is not validated against anything. It names a responsibility the
        system never routes to anyone.
      gap: GAP-011
