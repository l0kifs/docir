- id: GAP-011
  class: missing
  flow: FLOW-003
  step: "acting on staleness"
  finding: >
    Staleness is detected and never routed. `owner` is stored and interpolated into one
    `check` message; there is no notification, no `--owner` filter, no "documents I own"
    view, no scheduled reminder.
  actual_today: "A stale document stays stale until somebody happens to run `docir check`
                 and read past the orphan noise."
  actors_affected: [document owner / steward, repository maintainer]
  evidence:
    - src/docir/modules/documents/domain/services/graph_checks.py:100-102
    - src/docir/modules/documents/domain/entities/document.py:37
  confidence: observed
  severity: material
  impact: >
    "Knows what's stale" is one of six rows in the README's comparison table (README:44) and
    one of four bullets in "The model". The detection is real; the loop that would make it
    change anything is absent. ADR-0006 justifies not auto-detecting staleness — it does not
    address delivering it to the named owner.
  frequency: "continuous once any document passes its cadence (365d default)"
  proposed_default: >
    Add `docir query --owner <name>` and `--stale` as first-class filters. That is the
    smallest thing that turns the data into a workflow, and it needs no new subsystem.
  question: Q-013
  status: resolved
  resolution: >
    FIXED 2026-07-28, as proposed and no further. `docir query --owner <name>` and
    `--stale` are first-class filters; together they are one steward's review queue, and
    `docir update <id> --verified` clears an entry. Verified end-to-end on the real CLI
    through the whole loop, including that `--verified` empties the queue.
    The two filters live in different layers on purpose. `owner` is a column, so it is a SQL
    predicate on `DocumentFilter`. Staleness is *derived* — clock minus the document's
    reference date against the type's `review_days` — and the index stores neither the clock
    nor the schema, so `DocumentFilter` deliberately has no `stale` field and the service
    filters after the query. Pushing it into SQL would mean denormalising a value that
    changes every day without a write.
    ORDERING IS LOAD-BEARING: the stale filter runs *before* the limit, so `--stale --limit
    10` means ten stale documents rather than the stale ones among the first ten. The
    fixture corpus is built so the naive order fails loudly — the newest document sorts
    first and is not stale, so a limit applied first returns nothing at all. Pinned by
    test_stale_is_filtered_before_the_limit and confirmed by reverting the order.
    NO NEW SUBSYSTEM, deliberately: no notifications, no scheduler, no assignment workflow.
    ADR-0006's argument that staleness must be honest human re-verification applies to the
    delivery mechanism too — an automated nag that a bot can clear is not a human vouching
    for content. The agent guide now says stale means "nobody has vouched recently", not
    "wrong", and that `--verified` must never be stamped on a document the agent has not
    actually read.


- id: GAP-036
  class: missing
  flow: FLOW-004
  step: "adopting docir in a repo that already has documents"
  finding: >
    There is no import path. A repository with existing ADRs must create each document
    through `docir add`, and because ids are always allocated by the system (BR-006), the
    existing ADR numbers cannot be preserved.
  actual_today: >
    No `import`, `export`, `migrate` or `adopt` command exists anywhere in the CLI
    (verified by search). Every cross-reference in the existing corpus breaks on adoption.
  actors_affected: [repository maintainer]
  evidence:
    - src/docir/entry_points/cli/app.py       # full command surface; no import path
    - src/docir/modules/documents/application/services/id_generator.py:26-40
  confidence: observed
  severity: material
  impact: >
    The most likely adopter is precisely a project that already keeps ADRs in markdown — the
    audience the product describes. For them the on-ramp is a hand-written migration script
    plus renumbering every historical reference. The bulk-import path is, as the coverage
    checklist predicts, both the most important and the least documented flow.
  frequency: "once per adopting repository, at the moment of adoption"
  proposed_default: >
    NOT a command. `docir import` was built on 2026-07-27 and REMOVED the same day before
    committing; the reasoning is worth keeping so it is not rebuilt naively.

    It preserved the number a filename implies, inferred title/description/status, and
    handled a directory in one pass. It worked perfectly on docir's own ADRs. It was removed
    for two reasons that compound:

    (a) The maintainer wanted random ids by default even for numbered sources, which removes
    the one thing import could do that `docir add` cannot. What remained was inference —
    and every inference is a guess the agent must verify. Verifying a guess is not cheaper
    than making the judgement; it is often dearer, because the guess must first be noticed
    as wrong. The agent reads every source file either way, so import saved the *writing*,
    and writing was never the bottleneck.

    (b) It reported success on input it had silently mangled. DEMONSTRATED: a `decisions.md`
    holding three decisions — one superseded, one rejected — became ONE document titled
    "Architecture decisions" with status `proposed`; a file whose body read "DRAFT — do not
    rely on this" imported as `proposed`, indistinguishable from a real decision. The report
    said `imported 2, failed 0`. An agent reading that concludes the migration is done.

    The honest replacement is a documented workflow, now in the packaged agent guide: read
    each file, decide whether it is one document or several, judge whether it is still true,
    write a real description, pick the type, then `docir add`. Adoption stays awkward — that
    is the true state of affairs, and a command that hid it made things worse.

    If it is ever revisited, the design that would address (b) is importing *archived*, so
    documents are invisible to every read path until an agent reviews and unarchives each
    one — review becomes structural rather than advisory.
  question: Q-012
  status: open

