    resolving a document re-indexes it, which moves its FTS row to the *back*, so
    equally-weighted closed documents drift behind the open ones and a fixed pool finds the
    open ones anyway. The fixture now gives the closed documents repeated query terms so BM25
    ranks them first — the shape the finding actually describes. Recorded because the same
    trap will catch the next person writing a search test.

