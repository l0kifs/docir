  resolution: >
    FIXED 2026-07-29 — but not by adding the field, which was the wrong shape for the cost.
    `store` is one absolute path, identical for every row, and a list response has nowhere to
    put it once; per row it would dwarf the 4.7% that one small field added to a `context`
    payload. The question a reader actually has is "am I reading the corpus I think I am?",
    and the global-fallback warning already answers it for nothing on stdout — it just was
    not wired to the read paths. It is now (`query`/`search`/`context`/`get`), and its wording
    changed from "writing to" to "using", since it is no longer write-only.
    Recorded because the finding asked for the field and the fix is deliberately not that:
    on a token-budgeted read path, a stderr signal beats a payload field that repeats.
