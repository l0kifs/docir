  impact: >
    "Is this decision still current?" is the question the relation graph most needs to answer,
    and it is the one direction not traversed. An agent retrieving an old ADR gets no signal
    that a newer one supersedes it — while the superseding edge sits one hop away, backwards.
  frequency: "any corpus using supersedes"
  proposed_default: "Follow incoming `supersedes`/`contradicts` edges as well, or always
                     include the superseding document when one exists."
  question: Q-017
  status: resolved
  resolution: >
    FIXED 2026-07-27, as proposed. Expansion now walks incoming `supersedes`/`contradicts`
    edges as well as outgoing ones, via a `kinds` filter added to
    `DocumentRepository.incoming` (the method existed and was used only by delete). Successors
    are placed *first* in each seed's edge list, so under a tight `--expand` budget "what
    replaces this?" outranks an ordinary link — it is the one neighbour that can invalidate
    the document the agent is about to act on.
    `_SUCCESSOR_KINDS` is deliberately a separate constant from
    the layering check's kind set (then `_NON_DEPENDENCY_KINDS`, since inverted to
    `_DEPENDENCY_KINDS` by GAP-008); they held the same two kinds that day for unrelated
    reasons and must be free to diverge.
    Pinned by test_superseding_decision_is_reached_backwards (`--limit 2 --expand 1`, so the
    successor can only occupy the graph slot). Attribution verified: reverting only the
    incoming lookup fails that test and leaves the other two passing.
    NOT measurable in `benchmarks/`: the corpus contains no `supersedes` edge and no
    inactive document, so both fixes are invisible to it (0.96/0.88 recall@5 unchanged either
    side of the change). Recorded as GAP-046 rather than papered over by editing the corpus,
    which would break comparability with every number recorded before today.

