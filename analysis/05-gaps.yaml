- id: GAP-014
  class: missing
  flow: FLOW-001
  step: "--override on an illegal status transition"
  finding: >
    `--override` bypasses the transition rules and leaves no trace. The resulting document is
    indistinguishable from one that transitioned legally.
  actual_today: "Status changes; no marker, no note, no audit field. The status grammar — a
                 Tier 0 hard rule — has an unlogged escape hatch."
  actors_affected: [repository maintainer, AI coding agent]
  evidence: [src/docir/modules/documents/application/services/document_service.py:324-329]
  confidence: observed
  severity: material
  impact: >
    Coverage checklist: "Admin: who can override a rule, and is the override audited?" — the
    override exists, the audit does not. git history records that the status changed but not
    that a rule was bypassed to change it.
  frequency: unknown
  proposed_default: "Either record the override in frontmatter (e.g. an `overrides:` note), or
                     drop the flag and require an explicit two-step transition."
  question: Q-014
  status: resolved
  resolution: >
    DECIDED 2026-07-29 by the maintainer, from three options: warn loudly, store nothing.
    `--override` keeps working and now prints a stderr warning naming the rule it broke and
