- id: GAP-043
  class: misleading
  flow: FLOW-002
  step: "semantic ranking in a default install"
  finding: >
    The default embedder does not capture meaning. `DeterministicEmbedder` is signed feature
    hashing over tokens, so it scores similarity by shared vocabulary — the same signal FTS5
    already provides. In a default install both halves of the "hybrid" ranking are lexical.
  actual_today: >
    MEASURED 2026-07-26 by benchmarks/run.py. With the default embedder `context` beats plain
    `search` by +0.03 recall and -0.03 MRR — noise at 12 tasks. With `fastembed` it beats it
    by +0.11 recall and +0.13 MRR. On tasks phrased without the corpus vocabulary, recall is
    0.83 (default) vs 0.92 (fastembed) vs 0.75 (search). Direct probe: the sentences
    "duplicate charges when the customer double-clicks pay" and "idempotency keys for payment
    capture" score cosine 0.000 under the default embedder.
  actors_affected: [AI coding agent, repository maintainer]
  evidence:
    - src/docir/platform/embedding/deterministic.py:1-8
    - benchmarks/README.md
    - README.md:42
  confidence: observed
  severity: material
  impact: >
    README:42 claims "Retrieval by meaning ✅ (lexical + semantic)" against RAG's ✅ and plain
    files' ❌. That is earned only with `DOCIR_EMBEDDER=fastembed` plus the `embeddings`
    extra, which is off by default — so the comparison table describes a configuration most
    users will not be running. The docstring in deterministic.py is honest ("captures real
    lexical overlap"); the README is not.
  frequency: "every default install"
  proposed_default: >
    Say so in the README's table and in `docir --help`: mark semantic retrieval as requiring
    the extra, or make `docir init` offer to enable it. The code is fine; the claim is not.
  question: null
  status: resolved
  resolution: >
    FIXED 2026-07-26 as a documentation-honesty change; no code changed, because the code was
    never wrong — the claim was. The README comparison table now reads "lexical by default,
    semantic with an extra" with a footnote giving the install command and the measured
    difference (0.96 vs 0.88 recall@5; 0.92 vs 0.83 on paraphrased tasks; search 0.75), linked
    to benchmarks/ so a reader can reproduce it. "Hybrid lexical + semantic" in the command
    table and the agent guide became "full-text and vector rankings fused", which is true in
    both configurations. The packaged agent guide now tells an agent to phrase `context`
    queries in the project's own vocabulary unless fastembed is enabled, and to retry with the
    codebase's terms when a query under-retrieves — turning the limitation into usable advice.
    CLAUDE.md records the invariant for maintainers, with the instruction to re-run the
    benchmark before and after touching ranking.
    SUPERSEDED same day: the maintainer decided the model should be the default, so the
    caveat is gone rather than documented. `fastembed` is now a hard dependency;
    `DOCIR_EMBEDDER=deterministic` selects the model-free fallback (the test suite does this,
    which is what keeps it hermetic). The README states the real cost measured on this
    machine: ~64 MB model downloaded once, ~240 MB of dependencies, CPU-only, local. The
    "works offline" row is now honest about the one-time download.
    Prerequisite discovered while implementing, see GAP-044: the switch would have broken
    every existing store.

- id: GAP-044
  class: unstated
  flow: FLOW-002
  step: "changing the embedder on an existing store"
  finding: >
    Nothing recorded which model produced a stored vector, so changing embedder left the index
    full of vectors from the old one. Different models have different widths, and
    `Embedding.cosine_similarity` raises on a mismatch rather than degrading.
  actual_today: >
    FOUND AND FIXED 2026-07-26 while making fastembed the default — the change would have
    broken every existing store on upgrade. Verified before the fix:
    `Embedding((0.1,)*256).cosine_similarity(Embedding((0.1,)*384))` raises
    `ValueError: dimension mismatch: 256 != 384`, and `docir context` reads every active
    vector, so the first read after upgrading would have raised. The `embeddings.model_id`
    column existed since migration 0001 but `set_vector` never wrote it, so there was no way
    to detect the switch either.
  actors_affected: [AI coding agent, repository maintainer]
  evidence:
    - src/docir/platform/persistence/repositories.py:272-300
    - src/docir/platform/embedding/vector.py
    - src/docir/platform/persistence/alembic/versions/0001_initial_index.py:69-80
  confidence: observed
  severity: material
  impact: >
    A dead column that turned out to be load-bearing. Any embedder change — the new default,
    a future model upgrade, or a user toggling DOCIR_EMBEDDER — would have made the flagship
    read path raise until someone guessed at `docir reindex --embeddings`.
  frequency: "every store upgrading past the default flip"
  proposed_default: >
    FIXED. `set_vector` writes `model_id`; `active_vectors(model_id)` returns only matching
    rows so foreign vectors fall out of ranking instead of raising; `dirty_ids(model_id)`
    treats a foreign or NULL model_id as dirty, so they are recomputed on the next write or
    `docir embed --flush`. Verified end to end: a store built with the old embedder now
    answers `docir context` without error after the switch and re-embeds transparently.
    Pinned by test_vectors_from_another_model_are_recomputed_not_compared.
    Residual: the first read after a switch has no semantic signal until the recompute runs.
  question: null
  status: resolved

- id: GAP-045
  class: unstated
  flow: FLOW-002
  step: "the gates, once fastembed became the default"
  finding: >
    The default embedder path was excluded from every quality gate. `fastembed.py` was
    excluded from `ty`, omitted from coverage, carried `# pragma: no cover`, and no test
    referenced it — while CI installed ~240 MB of dependencies and then exercised none of it.
  actual_today: >
    FOUND AND FIXED 2026-07-27, immediately after the default flip. The exclusions were
    written when the adapter was opt-in, where they were defensible; making it the default
    silently turned them into a hole. Their own comments had become false ("imports an
    optional, not-installed dependency"). Lifting the `ty` exclusion surfaced a real
    diagnostic on the first run: `unresolved-attribute: Object of type object has no attribute
    embed` — the adapter held its model as a bare `object` behind a mypy-flavoured
    `type: ignore`.
  actors_affected: [repository maintainer, AI coding agent]
  evidence:
    - pyproject.toml
    - .github/workflows/ci.yml
    - src/docir/platform/embedding/fastembed.py
  confidence: observed
  severity: material
  impact: >
    A typo in `FastEmbedEmbedder.embed` would have shipped green to every default install.
    The general shape is worth remembering: an exclusion is scoped to an assumption
    ("optional, rarely used"), and nothing re-checks the exclusion when the assumption changes.
  frequency: "every CI run since the default flip"
  proposed_default: >
    FIXED. Both exclusions dropped; the adapter now depends on a `_TextEmbedding` Protocol
    instead of `object`, so it type-checks honestly. Three `slow` tests exercise the real model
    (dimension, meaning-over-wording, determinism) plus fast tests for embedder selection and
    the missing-dependency fallback. Coverage of the file went from omitted to 97%. CI caches
    `~/.cache/fastembed` so the ~64 MB download happens once, not per run. `pytest -m "not
    slow"` still runs model-free for local work.
  question: null
  status: resolved

- id: GAP-046
  class: missing
  flow: FLOW-002
  step: "measuring a retrieval change"
  finding: >
    The benchmark corpus contains no `supersedes` edge and no document in an inactive status,
    so the two graph behaviours `docir context` most depends on are structurally invisible to
    the only measurement the project has.
  actual_today: >
    OBSERVED 2026-07-27. The GAP-004 + GAP-019 fixes changed retrieval semantics on both the
    visibility and the traversal path, and every benchmark number was byte-identical either
    side of them (recall@5 0.96 fastembed / 0.88 deterministic). All 20 documents use bare
    `related:` ids, which resolve to `relates_to`, and all statuses are type defaults.
  actors_affected: [repository maintainer]
  evidence:
    - benchmarks/corpus.yaml
    - analysis/99-log.md   # the before/after runs
  confidence: observed
  severity: material
  impact: >
    A harness that cannot move is read as "no regression" when it means "not measured". The
    same blindness applies to any future change to expansion, visibility or relation kinds —
    the parts of `context` that distinguish it from `search`, and therefore the parts most
    worth a regression signal. GAP-001 was closed by building this harness; this is the
    boundary of what it closed.
  frequency: "every retrieval change touching the graph"
  proposed_default: >
    Add a superseded/superseding decision pair and one closed issue to `corpus.yaml`, with
    tasks that discriminate them (e.g. "is the Redis session decision still current?"). Note
    that this re-bases every recorded number, so publish the new baseline in the same commit
    and mark the old figures as pre-rebase rather than editing them away.
  question: null
  status: resolved
  resolution: >
    FIXED 2026-07-27, as proposed, at the maintainer's direction. `corpus.yaml` gains
    `adr-sessions-redis` / `adr-sessions-postgres` (linked by a `supersedes` edge) and the
    resolved `issue-session-loss`; `tasks.yaml` gains T13/T14, which judge the successor
    relevant alongside the document it replaces. The loader learned two things it needed for
    that: typed `related` entries (`key:kind`) and `status_path`, a list of legal transitions
    walked in order — a path rather than a value because `decision` starts at `proposed`, and
    walked rather than forced with `--override` so the corpus stays one the CLI would accept.
    `adr-sessions-redis` is deliberately left `accepted`: a correctly-superseded document is
    filtered from `context` by status, so it can demonstrate nothing about traversal, and the
    document nobody went back to close is the realistic case anyway.
    The harness now moves. Measured by reverting each fix against the new corpus:
    `context` recall@5 0.93 -> 0.96 (prec 0.37 -> 0.39) under fastembed and 0.89 -> 0.93
    (0.36 -> 0.37) under the fallback. Recall and precision move together, as expected: the
    successor arrives and the resolved issue stops taking a slot.
    Baseline re-based: 23 documents / 14 tasks, published in benchmarks/README.md with the
    old 20/12 figures marked pre-rebase rather than deleted.
    SIDE EFFECT, recorded because it cuts against a previous conclusion: the re-based corpus
    weakens the *headline* argument for ADR-0011 (full `context` 0.96 vs 0.93, where it was
    0.96 vs 0.88) because graph expansion lifts both embedders. The argument is stronger at
    `--expand 0`, which isolates the ranking: the fallback scores 0.80, *below* the 0.83 plain
    `search` manages alone, while the model scores 0.87. README and CLAUDE.md now quote that
    pair instead. The conclusion did not change; the evidence for it did.

