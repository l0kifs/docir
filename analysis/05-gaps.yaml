# Gap register — PRIMARY DELIVERABLE. Sorted by severity, not discovery order.
#
# class:      missing | misleading | incorrect | unusual | unstated
# severity:   blocking (wrong answer changes the design, or touches data loss)
#             material (affects real users regularly, has a workaround)
#             cosmetic (worth recording, not worth a question this round)
# confidence: observed = executed against the real CLI, or read directly off code
#
# frequency:  "unknown" almost everywhere — the product has NO telemetry (GAP-001),
#             so nothing here is ranked by measured impact. That is itself finding #1.

# =============================================================================
# BLOCKING
# =============================================================================

- id: GAP-003
  class: incorrect
  flow: FLOW-003
  step: "reindex, then the next add"
  finding: >
    `reindex` does not restore the id counter (`id_sequences`), so after any rebuild the
    next `add` re-issues an id that is already in use. Both files persist; the index keeps
    only the newer one; the older document becomes invisible to every read path.
  actual_today: >
    OBSERVED end to end. Store with adr-0001 "First" and adr-0002 "Second"; delete index.db
    (it is gitignored — this is exactly a fresh clone); `docir reindex` reports
    documents_indexed 2; `docir add --type decision --title "Third"` returns id **adr-0001**.
    Disk now holds adr-0001-first-decision.md AND adr-0001-third-decision.md.
    `docir get adr-0001` returns "Third decision". `docir query` lists two documents, not
    three. "First decision" is unreachable through get, query, search and context while its
    file sits untouched on disk. No error, no warning, exit code 0.
  actors_affected: [AI coding agent, repository maintainer, git / branch merge]
  evidence:
    - src/docir/modules/documents/application/services/maintenance_service.py:148-174
    - src/docir/platform/persistence/repositories.py:48-56
    - analysis/99-log.md   # PROBE-1, PROBE-2
  confidence: observed
  severity: blocking
  impact: >
    Silent loss of a decision record on the documented happy path. It requires no
    concurrency, no --force, no unusual input — only `git clone` followed by the rebuild
    command the README tells you to run. It contradicts the project's first thesis ("the
    index is a derived, rebuildable projection"): the rebuild is not faithful.
  frequency: "once per fresh clone that then adds a document — i.e. every new contributor"
  proposed_default: >
    `_reindex_documents` should, for each sequential-id type, set the counter to
    max(existing numeric suffix) + 1 as part of the rebuild. Add a regression test that
    clones→reindexes→adds and asserts the new id is unused.
  question: Q-001
  status: resolved
  resolution: >
    FIXED 2026-07-26. `MaintenanceService._restore_id_sequences` rebuilds the counter from the
    ids on disk (monotonic, so deleting the highest-numbered doc does not free its id).
    Two backstops added for the paths reindex does not cover: `IdGenerator` skips a candidate
    already indexed, and `add` refuses to write when a file already claims the id
    (`DuplicateDocumentIdError`, exit 5) instead of silently overwriting. Verified by replaying
    PROBE-1 against the real CLI — clone→reindex→add now yields adr-0003 and all three
    documents stay visible. Pinned by test_reindex_restores_the_id_counter,
    test_reindex_never_rewinds_the_counter and
    test_add_refuses_to_clobber_a_file_owning_the_allocated_id.

- id: GAP-009
  class: incorrect
  flow: FLOW-001
  step: "id allocation under concurrency"
  finding: >
    With `--no-daemon`, concurrent `add` invocations all receive the same id. The
    read-modify-write of the counter is not serialized at the SQLite level; nothing detects
    the collision.
  actual_today: >
    OBSERVED. Six simultaneous `docir --no-daemon add` calls against one store ALL returned
    `adr-0002`, all exited 0, and produced six files claiming that id. Only one is visible
    in the index. The same race with the daemon (the default) produced adr-0002..adr-0007
    correctly — the daemon's single-connection loop is what actually serializes.
  actors_affected: [AI coding agent, repository maintainer, CI job]
  evidence:
    - src/docir/platform/persistence/repositories.py:48-56
    - src/docir/platform/transport/server.py:20-25
    - src/docir/modules/documents/application/services/id_generator.py:3-5
    - analysis/99-log.md   # PROBE-10 vs PROBE-11
  confidence: observed
  severity: blocking
  impact: >
    Contradicts a documented invariant. CLAUDE.md states the counter "is what keeps parallel
    agents from minting the same id"; it is the daemon that does. `--no-daemon` is presented
    as an equal alternative (README:136-139) and is what the project's own test suite and CI
    use, so the mode where the guarantee fails is the mode most likely to be scripted.
  frequency: "unknown; requires two agents/processes writing at once, which is the stated
              multi-agent use case"
  proposed_default: >
    Take the counter update inside an IMMEDIATE transaction (or `UPDATE … RETURNING` under a
    write lock), so allocation is atomic regardless of daemon mode. Failing that, document
    plainly that `--no-daemon` is single-writer-only and make the bundled profiles use
    `id_style: random`, which is already implemented and immune (as of 2026-07-26 this is
    what `docir init` writes by default — see BR-074).
  question: Q-002
  status: resolved
  resolution: >
    FIXED 2026-07-26. `next_number` is now a single atomic upsert
    (`INSERT … ON CONFLICT DO UPDATE SET next_value = next_value + 1 RETURNING next_value - 1`),
    so the increment happens under SQLite's write lock instead of in Python between two
    statements. `busy_timeout` is now set explicitly in `create_index_engine` so a blocked
    writer waits rather than erroring. Verified by isolating the change: with the retry loop
    and file guard temporarily removed, 16 barrier-synchronised concurrent adds x3 rounds
    produced 16 unique ids every time, where the old code collided at 6. Pinned by
    tests/modules/documents/test_concurrent_ids.py (marked `slow`, spawns real processes),
    which was confirmed to FAIL against the reverted implementation.
    Note the guarantee no longer depends on the daemon; the daemon remains the serializer for
    everything else.

- id: GAP-005
  class: incorrect
  flow: FLOW-002
  step: "graph expansion after ranking"
  finding: >
    `--limit` bounds the ranked seed set but not the response. One-hop graph expansion runs
    afterwards and appends neighbours with no cap.
  actual_today: >
    OBSERVED. Three decisions each with two outgoing edges: `docir context "cache
    invalidation policy" --limit 3` returned **9** documents. Worst case is
    limit × (1 + max out-degree).
  actors_affected: [AI coding agent]
  evidence:
    - src/docir/modules/documents/application/services/document_service.py:260-273
    - src/docir/modules/documents/application/services/document_service.py:297-307
    - analysis/99-log.md   # PROBE-5
  confidence: observed
  severity: blocking
  impact: >
    Directly negates the product's headline claim. docir exists to be "token-cheap for
    agents" (README:46); `context` is the flagship command; its default limit is 5; and the
    caller has no way to bound what comes back. On a well-linked corpus — the corpus docir
    is built to encourage — the overrun grows with graph density, so the tool degrades
    exactly as it is adopted successfully.
  frequency: "every `context` call against a corpus with relations"
  proposed_default: >
    Apply `limit` to the final result, or add a separate explicit budget for graph-expanded
    neighbours (e.g. `--expand N`, default 0 or 1) and document the interaction.
  question: Q-003
  status: resolved
  resolution: >
    FIXED 2026-07-26. `--limit` is now a hard ceiling on the response and graph expansion runs
    inside it: `--expand N` (default 2) reserves at most N slots for neighbours, expansion is
    breadth-first across seeds so one dense hit cannot spend the whole budget, and slots the
    graph does not use are backfilled with more ranked hits — so a result is always
    min(limit, what exists). `expand` is clamped below `limit`, so a seed can never be crowded
    out. Verified by replaying PROBE-5 against the real CLI: --limit 3 now returns 3 (was 9),
    --expand 0 disables the graph, --limit 1 returns 1 ranked hit. Pinned by
    TestContextBudget in tests/modules/documents/test_integration_documents.py, confirmed to
    FAIL (assert 9 == 3) against the reverted implementation.

- id: GAP-006
  class: misleading
  flow: FLOW-003
  step: "CI gate"
  finding: >
    `docir check --strict` exits 1 on any finding of any kind, and `orphan` fires for every
    document with no relations — the default state of a newly created document. There is no
    severity, no `--only <kind>`, and no ignore mechanism.
  actual_today: >
    OBSERVED. A brand-new store with two unrelated, otherwise-healthy documents exits 1 from
    two `orphan` findings alone.
  actors_affected: [CI job, repository maintainer]
  evidence:
    - src/docir/entry_points/cli/app.py:419-440
    - src/docir/modules/documents/domain/services/graph_checks.py:173-192
    - analysis/99-log.md   # PROBE-3
  confidence: observed
  severity: blocking
  impact: >
    The one CI integration the product advertises cannot be adopted as documented. A team
    that tries it gets a red build immediately and will remove the gate — which also removes
    duplicate-id and dangling detection, the gate's actual purpose and the only automated
    defence against GAP-003 and GAP-009. It also contradicts the tier model: `check` is
    documented as producing warnings that never block, while `--strict` makes all of them
    blocking equally.
  frequency: "first CI run of any adopting repo"
  proposed_default: >
    Give findings a severity (`error`: duplicate-id, dangling, malformed; `warning`: orphan,
    cycle, layering, stale, unknown-type) and make `--strict` fail on errors only, with
    `--strict=all` for the current behaviour.
  question: Q-004
  status: resolved
  resolution: >
    FIXED 2026-07-26. `CheckIssue` now carries a `severity`, derived from `kind` in
    `__post_init__` so a new check cannot forget to classify itself. `ERROR_KINDS` is
    duplicate-id / dangling / malformed — the corpus is broken; everything else is a warning
    about shape or age. `--strict` gates on errors only; `--strict-all` keeps the old
    fail-on-anything behaviour. Findings render red vs yellow at a TTY and expose `severity`
    in JSON. Verified by replaying PROBE-3 against the real CLI: two healthy unrelated
    documents now exit 0 under `--strict` (1 under `--strict-all`), while a forced delete
    that leaves a dangling edge exits 1. Pinned by test_check_strict_gates_ci,
    test_check_strict_fails_on_a_broken_graph and test_findings_carry_a_severity.
    Note: test_check_strict_gates_ci previously asserted the OPPOSITE ("an orphan doc is a
    Tier 1 issue: --strict now fails") — the old behaviour was encoded as intent, which is
    why the gap survived to be found by running the tool rather than by reading the tests.

- id: GAP-001
  class: missing
  flow: null
  step: "the whole product"
  finding: >
    Nothing measures whether docir achieves its purpose. No telemetry, no counters, no
    benchmark harness, no logging of business events, no way to answer "did retrieval change
    what the agent did?"
  actual_today: >
    The README's own comparison table is labelled "Rough orientation, not a benchmark"
    (README:48). The two central claims — better retrieval than RAG, cheaper than raw files
    — are unmeasured by the author.
  actors_affected: [repository maintainer]
  evidence: [README.md:39-48, analysis/99-log.md]   # exhaustive search for telemetry: none
  confidence: observed
  severity: blocking
  impact: >
    Not a defect in the code; a defect in the ability to make decisions about the code.
    It is why every other gap in this register has `frequency: unknown`, why the retrieval
    quality parameters (GAP-017, BR-026, BR-046 thresholds) cannot be tuned on evidence, and
    why there is no way to know whether GAP-005's token overrun matters in practice or is
    the dominant cost.
  frequency: n/a
  proposed_default: >
    Before tuning retrieval further, build one honest offline benchmark: a fixture corpus, a
    set of task descriptions, and the documents a human judges relevant. Measure recall@k and
    tokens-returned. It does not need telemetry from users.
  question: Q-008
  status: resolved
  resolution: >
    FIXED 2026-07-26. `benchmarks/` now measures both claims offline — no telemetry, no
    users: 20-document corpus, 12 tasks with relevance judgments, recall/precision/MRR and
    payload size per retrieval strategy. Run with the default embedder and with
    DOCIR_EMBEDDER=fastembed to get the contrast. Results and their limits are in
    benchmarks/README.md. Deliberately not a pass/fail test: it prints numbers and exits 0,
    because a threshold set before the numbers are understood would just encode today's
    behaviour as intent (the mistake that let GAP-006 survive).
    The retrieval constants can now be tuned on evidence, and GAP-042 (what random ids cost
    in tokens) is now answerable.

- id: GAP-012
  class: missing
  flow: FLOW-003
  step: "after check reports a problem"
  finding: >
    Four of the eight finding kinds — duplicate-id, dangling, malformed, unknown-type —
    describe corrupt state, and no command can fix any of them. No `docir repair`, no
    `--fix`, no documented manual procedure.
  actual_today: "The user hand-edits markdown and reruns reindex, guided by nothing."
  actors_affected: [support / operator, repository maintainer]
  evidence:
    - src/docir/modules/documents/application/services/maintenance_service.py:84-124
    - src/docir/entry_points/cli/app.py:419-440
  confidence: observed
  severity: blocking          # raised in the adversarial pass: meets "touches data loss"
  impact: >
    Every confirmed failure mode in this run (GAP-003, GAP-007, GAP-009) terminates in a
    state the product detects and cannot exit. That is also in direct tension with thesis #2,
    "agents never edit markdown directly" — recovery *requires* exactly that.
  frequency: "whenever GAP-003 or GAP-009 fires"
  proposed_default: >
    `docir check --fix` handling the mechanical cases: re-issue one of a duplicated pair of
    ids (rewriting inbound edges), drop dangling edges, and resync the id counter.
  question: Q-007
  status: resolved
  resolution: >
    FIXED 2026-07-26. `docir check --fix` (`MaintenanceService.repair`) repairs exactly what
    needs no guess about intent: duplicate ids are re-issued (the OLDEST file keeps the id,
    because existing edges were written against it and an edge cannot say which document it
    meant) and dangling edges are dropped from the canonical files. `malformed` and
    `unknown-type` are deliberately left alone — the first needs a human to say what the file
    was meant to be, the second is a schema decision — and are returned in
    `RepairResult.remaining`, so `check --fix --strict` still fails when a human is genuinely
    required. Repair does NOT advance `updated`: a mechanical fix is not a re-verification,
    and bumping it would launder the staleness clock (the GAP-020 failure mode).
    Verified against a store carrying all four kinds at once; pinned by six tests in
    tests/modules/documents/test_integration_maintenance.py plus two CLI tests.
    GAP-007 (delete --force leaving dead edges) is now recoverable, though still not
    prevented — it remains open as a separate concern.

