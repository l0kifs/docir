  resolution: >
    FIXED 2026-07-29 with the second option: the candidate pool doubles until the limit is met
    or the index is exhausted, so a short result means the corpus is short. Filtering in SQL
    was the alternative and was not taken — FTS5 does not know a document's status, so it
