- id: GAP-041
  class: incorrect
  flow: FLOW-003
  step: "reindex over a store using random ids"
  finding: >
    `_restore_id_sequences` classifies an id as sequential by testing whether its suffix is
    all digits, but a 12-char random hex token is all digits roughly once in 281 ids. Such an
    id is then read as the number 12345678901 and the prefix's counter is raised above it.
  actual_today: >
    FOUND 2026-07-26 by reasoning about the interaction of two same-day changes (the GAP-003
    counter restore, and `docir init` defaulting to `id_style: random`). Verified arithmetically:
    P(all digits) = (10/16)^12 = 0.36%; `DocId("adr-012345678901").number` returns 12345678901.
    Harmless while the type stays `random` — nothing reads the counter — so there is no
    user-visible symptom today.
  actors_affected: [repository maintainer]
  evidence:
    - src/docir/modules/documents/application/services/maintenance_service.py:136-157
    - src/docir/modules/documents/domain/value_objects/identifiers.py:64-73
  confidence: observed
  severity: cosmetic
  impact: >
    Latent only. It surfaces if a type is later switched from `random` to `sequential`: the
    next id is then an eleven-digit number (`adr-12345678902`) rather than `adr-0001`. No
    data loss, no collision — the ids are still unique and still valid.
  frequency: "0.36% of random ids; consequence requires a later switch to sequential"
  proposed_default: >
    Restore counters only for prefixes whose type declares `sequential`. `MaintenanceService`
    already holds the schema, so it can build that prefix set and skip the rest — the
    digit-shape test is the wrong signal for the question being asked.
  question: null
  status: resolved
  resolution: >
    FIXED 2026-07-26. `_restore_id_sequences` now derives the set of prefixes whose type
    declares `sequential` from the schema and considers only those; it returns immediately
    when a store has none. A second guard, `DocId.looks_random`, skips a suffix of
    random-token length even under a sequential prefix, which covers the leftovers of a type
    switched from `random` to `sequential` (length disambiguates: a counter would need a
    hundred billion documents to reach twelve digits). Pinned by
    test_reindex_ignores_random_ids_when_restoring_the_counter, confirmed to FAIL with
    `assert 'adr-12345678902' == 'adr-0001'` against the unguarded version, and by
    test_reindex_still_restores_the_counter_for_sequential_types, which holds the GAP-003
    fix in place.

