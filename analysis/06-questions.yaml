- id: Q-001
  gap: GAP-003
  also_resolves: [GAP-013]   # the same counter/transaction boundary
  audience: repo maintainer
  blocking: true
  rank: 1
  question: >
    `reindex` rebuilds documents, tags, FTS and embeddings but not the id counter, so on a
    fresh clone the next `add` re-issues a live id and the older document disappears from
    every read path. Is the id counter meant to be part of the derived, rebuildable index
    (in which case reindex must reconstruct it from the files), or is it authoritative state
    that must never be lost (in which case it cannot be gitignored)?
  today: >
    OBSERVED: clone (index absent, it is gitignored) → `docir reindex` → `docir add` returns
    an id that is already in use. Two files claim it; the index keeps the newer; the older
    document is unreachable via get/query/search/context though its file is untouched.
    Exit code 0 throughout.
    Evidence: maintenance_service.py:148-174, repositories.py:48-56.
  proposed_answer: >
    Derived. `_reindex_documents` should set each sequential prefix's counter to
    max(numeric suffix seen) + 1 as part of the rebuild, with a regression test for
    clone→reindex→add.
  context: >
    Fires on the documented happy path with no concurrency, no --force and no unusual input.
    It contradicts the project's first thesis, so the answer also decides whether that thesis
    needs qualifying in the README.
  asked: 2026-07-26
  answered: 2026-07-26
  authority: repo maintainer (instructed the fix directly)
  answer: >
    Derived — the proposed answer was adopted. reindex now restores the counter, with two
    allocation-time backstops. See GAP-003 resolution.
  assumption_if_unanswered: null

- id: Q-002
  gap: GAP-009
  audience: repo maintainer
  blocking: true
  rank: 2
  answered: 2026-07-26
  authority: repo maintainer (instructed the fix directly)
  question: >
    Six concurrent `--no-daemon` adds all returned `adr-0002`. With the daemon they were
    correctly unique. Is `--no-daemon` intended to be safe for parallel agents — or is the
    daemon a hard requirement for concurrent writing, and the counter's role in CLAUDE.md
    overstated?
  today: >
    OBSERVED: 6 simultaneous `docir --no-daemon add` → six files claiming adr-0002, all
    exit 0, five documents invisible. Same race with the daemon → adr-0002..adr-0007.
    CLAUDE.md attributes collision-freedom to the SequenceRow counter; the actual mechanism
    is the daemon's single-connection server loop (transport/server.py:20-25).
    The project's own test suite and CI force DOCIR_NO_DAEMON.
  proposed_answer: >
    Make allocation atomic regardless of mode (counter update inside an IMMEDIATE
    transaction, or `UPDATE … RETURNING` under a write lock). `id_style: random` already
    exists and is immune, but no shipped profile uses it.
  context: >
    "Parallel agents" is the exact scenario the invariant claims to protect, and `--no-daemon`
    is the mode most likely to appear in scripts and CI.
  asked: 2026-07-26
  answer: >
    ANSWERED 2026-07-26 by implementation: allocation is now atomic in both modes via a single
    upsert statement. `--no-daemon` is safe for parallel writers. CLAUDE.md updated to state
