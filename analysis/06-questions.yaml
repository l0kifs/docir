  context: >
    This is why every gap in the register carries `frequency: unknown`, why the retrieval
    constants (25 FTS candidates, 0.9 similarity, 8000 chars, RRF k=60) cannot be tuned on
    evidence, and why the token cost of Q-003 cannot be quantified.
  asked: 2026-07-26
  answered: 2026-07-26
  authority: repo maintainer (directed the build; proposed answer adopted as-is)
  answer: >
    ANSWERED 2026-07-26 by implementation, exactly as proposed: an offline benchmark, no
    telemetry — fixture corpus, task descriptions, human-judged relevant documents,
    recall/precision/MRR and payload size per strategy. It settled the embedder default
    (GAP-043) and is now the gate on retrieval changes.
    Re-based 2026-07-27 to 23 documents / 14 tasks after GAP-046 showed it could not observe
    the graph at all. The answer to "is measurement in scope before further retrieval tuning"
