- id: Q-008
  gap: GAP-001
  audience: repo maintainer
  blocking: true
  rank: 8
  question: >
    Nothing in the repo measures whether docir retrieves better or cheaper than the
    alternatives it is compared against. What would count as evidence that it works — and is
    building that measurement in scope before further retrieval tuning?
  today: >
    No telemetry, no counters, no benchmark harness, no logging of business events. The
    README's comparison table is explicitly labelled "Rough orientation, not a benchmark"
    (README:48).
  proposed_answer: >
    One offline benchmark, no user telemetry needed: a fixture corpus, a set of task
