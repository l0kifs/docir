  authority: repo maintainer (directed the fix; `check --fix` proposal adopted)
  audience: repo maintainer
  blocking: true
  rank: 7
  question: >
    duplicate-id, dangling, malformed and unknown-type all describe corrupt state, and no
    command can fix any of them. Combined with "agents never edit markdown directly", how is
    a user meant to recover — and should `delete --force` strip the edges it breaks, the way
    `tag rm --force` already strips tags?
  today: >
    `check` reports; nothing repairs. OBSERVED: after `delete issue-0001 --force`, adr-0001's
    file still reads `related: [issue-0001]`, and `update adr-0001 --set-title X` succeeds and
    re-persists the broken edge — Tier 0 validates only edges supplied in the current call.
    Evidence: document_service.py:190-206, validation.py:61-66; contrast tag_service.py:97-103.
  proposed_answer: >
    (a) `delete --force` strips the edge from referencing documents in the same transaction —
    the pattern already exists for tags. (b) Add `docir check --fix` for the mechanical cases:
    re-issue one of a duplicated id pair (rewriting inbound edges), drop dangling edges,
    resync the counter.
  context: >
    Every confirmed failure mode in this analysis ends in a state the product detects and
    cannot exit, and the documented recovery contradicts the product's second thesis.
  asked: 2026-07-26
  answer: >
    ANSWERED 2026-07-26 in part, completed 2026-07-28. Both halves are now implemented.
    (b) `docir check --fix` repairs duplicate ids and dangling edges. (a) `delete --force`
