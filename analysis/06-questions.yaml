            works; the loop that would make it matter is absent."
  asked: null
  answered: 2026-07-28
  authority: >
    repo maintainer (directed the work; the question was never answered separately, so the
    proposed answer was implemented as-is)
  answer: >
    By pulling, not by pushing. `docir query --owner <name> --stale` is the review queue and
