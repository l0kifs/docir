# Benchmark corpus — a plausible payments/checkout service.
#
# Written to exercise retrieval, not to be exemplary documentation. Bodies are
# short but real: enough vocabulary for full-text search to bite, and enough
# meaning for a semantic model to have something to do.
#
# `key` is a stable handle used by tasks.yaml; the actual docir id is allocated
# at load time and mapped back, so the judgments survive any id-style change.
#
# `related` entries are `key` or `key:kind` (a typed edge, adr-599055502f0e).
# `status_path` walks legal transitions in order — decisions start `proposed`, so
# reaching `superseded` means `[accepted, superseded]`. Applied after the edges,
# because a closed document cannot be edited.

- key: adr-idempotency
  type: decision
  title: Idempotency keys for payment capture
  description: Every capture request carries a client-generated key so retries cannot charge twice.
  body: |
    The capture endpoint accepts an `Idempotency-Key` header. The first request
    for a key performs the capture and stores the response; any later request
    with the same key replays that stored response without contacting the
    gateway. Keys are scoped per merchant and expire after 24 hours.
  related: []

- key: adr-card-tokens
  type: decision
  title: Store card tokens with the provider, never locally
  description: Card data never touches our infrastructure; we persist only opaque provider tokens.
  body: |
    The browser exchanges card details for a token directly with the payment
    provider. Our servers see only that token, which keeps the whole platform
    out of PCI-DSS cardholder-data scope. No database column, log line, or
    error report may ever contain a pan or a cvv.
  related: []

- key: adr-settlement-batch
  type: decision
  title: Reconcile settlement asynchronously in a nightly batch
  description: Settlement files from the provider are reconciled overnight rather than in real time.
  body: |
    The provider publishes a settlement file once a day. A nightly job matches
    each settled line against our captured payments and writes a reconciliation
    record. Real-time reconciliation was rejected: the provider's own figures
    are not final until the file lands.
  related: []

- key: adr-optimistic-locking
  type: decision
  title: Optimistic locking on the orders table
  description: Concurrent writers to one order are resolved by a version column, not by row locks.
  body: |
    Every order row carries a `version` integer. A write asserts the version it
    read and increments it; a mismatch means someone else got there first and
    the caller retries against fresh state. Pessimistic row locks were rejected
    because checkout holds an order open across several user-facing steps.
  related: []

- key: adr-refunds-partial
  type: decision
  title: Refunds are partial-first
  description: Every refund is modelled as a partial refund; a full refund is the degenerate case.
  body: |
    There is one refund path and it takes an amount. A full refund is simply a
    refund for the remaining refundable balance. Modelling full and partial
    refunds separately produced two code paths that disagreed about fees.
  related: []

- key: adr-gateway-retries
  type: decision
  title: Retry gateway timeouts with exponential backoff
  description: A timed-out gateway call is retried three times with backoff before failing the payment.
  body: |
    Gateway calls that time out are retried at 1s, 4s and 16s. After the third
    failure the payment is marked `pending_review` rather than failed, because a
    timeout is ambiguous: the gateway may have processed it. Retries always
    carry the same idempotency key.
  related: [adr-idempotency]

- key: adr-currency-rounding
  type: decision
  title: Round half-even at two decimal places, store minor units
  description: All monetary amounts are integers in minor units; division rounds half-even.
  body: |
    Amounts are stored as integer minor units (cents), never as floats. Where a
    division is unavoidable — splitting a discount across line items — we round
    half to even so repeated splits do not drift upward. The remainder is
    assigned to the largest line item.
  related: []

- key: adr-webhook-hmac
  type: decision
  title: Verify webhook signatures with HMAC-SHA256
  description: Inbound provider webhooks are authenticated by an HMAC signature over the raw body.
  body: |
    Each webhook carries a signature header computed over the raw request body
    with a shared secret. We verify before parsing, compare in constant time,
    and reject anything older than five minutes to bound replay.
  related: []

- key: adr-dlq-manual
  type: decision
  title: Dead-letter replay is manual and audited
  description: Messages in the dead-letter queue are never replayed automatically.
  body: |
    A message reaching the dead-letter queue has already failed its retries, so
    replaying it automatically tends to reproduce the failure at volume. Replay
    is an explicit operator action, recorded with who did it and why.
  related: []

- key: adr-order-state-machine
  type: decision
  title: Orders move through an explicit state machine
  description: Order status transitions are declared up front; illegal transitions are rejected.
  body: |
    An order is one of pending, authorized, captured, settled, refunded or
    cancelled, with the legal transitions declared in one table. Anything else
    is rejected at write time rather than discovered later in a report.
  related: []

- key: issue-duplicate-charges
  type: issue
  title: Duplicate charges when the customer double-clicks pay
  description: Impatient customers clicking pay twice produce two captures on one order.
  body: |
    Support has seen customers charged twice after clicking the pay button
    repeatedly on a slow connection. Both requests reach the capture endpoint
    before the first response returns, and both succeed.
  related: [adr-idempotency]

- key: issue-settlement-drift
  type: issue
  title: Settlement report totals drift by a few cents
  description: Our reconciled total and the provider's settlement file disagree by small amounts.
  body: |
    The nightly reconciliation reports a total a few cents below the provider's
    figure on days with many discounted multi-item orders. The difference grows
    with the number of split discounts.
  related: [adr-currency-rounding]

- key: issue-refund-archived
  type: issue
  title: Refund fails when the order has been archived
  description: Refunding an archived order returns a not-found error instead of refunding.
  body: |
    Orders archived by the housekeeping job are excluded from the default order
    lookup, so the refund endpoint cannot find them and returns 404 even though
    the payment is perfectly refundable.
  related: [adr-refunds-partial]

- key: issue-webhook-flood
  type: issue
  title: Webhook replay floods the queue after a provider outage
  description: When the provider recovers it resends hours of webhooks at once and the queue backs up.
  body: |
    After the provider's four-hour outage they redelivered every missed webhook
    within a few minutes. Our consumers fell behind, processing latency reached
    twenty minutes, and several messages hit the dead-letter queue.
  related: [adr-webhook-hmac, adr-dlq-manual]

- key: issue-checkout-timeout
  type: issue
  title: Checkout times out under peak load
  description: Checkout latency exceeds the gateway timeout during peak traffic events.
  body: |
    During the last sale, checkout p99 latency rose above the ten-second
    gateway timeout. Payments that did in fact succeed were reported to the
    customer as failures.
  related: [adr-gateway-retries]

- key: issue-stale-order-status
  type: issue
  title: Customer sees a stale order status after paying
  description: The confirmation page shows the pre-payment status for several seconds.
  body: |
    Two requests update the same order around the same moment — the capture
    callback and the customer's page refresh — and the later write sometimes
    overwrites the newer status with an older one.
  related: [adr-optimistic-locking]

- key: issue-reconciliation-oom
  type: issue
  title: Reconciliation job runs out of memory on large batches
  description: The nightly job loads the whole settlement file into memory and dies on big days.
  body: |
    The job reads the entire settlement file into a list before matching. On
    high-volume days the file exceeds available memory and the job is killed,
    leaving that day unreconciled.
  related: [adr-settlement-batch]

# -- The superseded pair and the closed issue ---------------------------------
#
# Added 2026-07-27. The corpus previously had no `supersedes` edge and no
# document in an inactive status, so the two graph behaviours `context` depends
# on most were invisible to this harness: a change to either moved no number.
#
# Note that `adr-sessions-redis` is left `accepted`, not `superseded`. That is
# the realistic case and the one that actually hurts: someone wrote the new
# decision and linked it, and nobody went back to close the old one. A properly
# superseded document is filtered out of `context` by status anyway, so it
# cannot demonstrate anything about traversal.

- key: adr-sessions-redis
  type: decision
  title: Keep checkout sessions in Redis
  description: An in-progress checkout is held in Redis, keyed by session id, for thirty minutes.
  body: |
    A shopper's in-progress checkout — selected items, address, chosen payment
    method — lives in Redis under the session id with a thirty minute TTL.
    Restarting the web tier therefore costs nobody their basket, and no
    checkout state touches the primary database on the hot path.
  related: [issue-session-loss]

- key: adr-sessions-postgres
  type: decision
  title: Durable user state moves to Postgres
  description: Long-lived shopper state is written to Postgres rather than an expiring cache.
  body: |
    Anything a shopper expects to survive — the basket they left yesterday, a
    saved delivery address, an abandoned order we intend to email about — is
    written to durable rows. Volatile keyspaces with a TTL are the wrong home
    for state a person believes they saved.
  related: [adr-sessions-redis:supersedes]

- key: issue-session-loss
  type: issue
  title: Baskets vanish when the cache is flushed
  description: Flushing the cache during a deploy empties every in-progress basket.
  body: |
    A cache flush in the middle of a deploy dropped every in-progress checkout,
    and shoppers mid-payment saw an empty basket. Fixed by draining before the
    flush; the underlying storage choice was not revisited at the time.
  related: []
  status_path: [resolved]

- key: arch-payment-boundaries
  type: architecture
  title: Payment service boundaries and data ownership
  description: Which service owns orders, payments and settlement records, and who may read what.
  body: |
    The order service owns order state. The payment service owns authorizations,
    captures and refunds, and is the only writer of payment records. Settlement
    records are owned by the reconciliation service. No service reads another's
    tables directly.
  related: []

- key: arch-payment-events
  type: architecture
  title: Payment event flow from placement to settlement
  description: The end-to-end sequence of events an order emits, and who consumes each.
  body: |
    OrderPlaced leads to PaymentAuthorized, then PaymentCaptured, then
    PaymentSettled once reconciliation matches the provider file. Each event is
    published once and consumed by the notification and analytics services.
  related: [arch-payment-boundaries, adr-order-state-machine]

- key: arch-queue-topology
  type: architecture
  title: Queue topology and dead-letter handling
  description: How work queues, retries and dead-letter queues are wired across the payment services.
  body: |
    Each consumer has a primary queue and a dead-letter queue. A message is
    retried in place three times, then moved to the dead-letter queue with its
    failure reason attached. Dead-letter queues are monitored but never drained
    automatically.
  related: [adr-dlq-manual]


# --- Long documents whose answer sits past the embedding window (2026-08-03) --
#
# Everything above is 163-297 body characters. That made the failure these three
# exist to expose unmeasurable, and the failure is not subtle: `bge-small-en-v1.5`
# reads about 512 tokens and silently ignores the rest, so for a document longer
# than roughly 2,000-3,000 characters the semantic index covers only the head.
# Appending a sentence past that point leaves the vector bit-identical.
#
# docir's own store has a median body of ~2,900 characters and a maximum of
# ~37,000, so this is the shape it actually holds, not a contrived one. Each
# document below runs 5,000-6,000 characters across ten H2 sections, and the
# section that answers its task is deliberately placed near the end — past the
# window, where a single whole-document vector cannot see it at all.

- key: arch-checkout-runtime
  type: architecture
  title: Checkout runtime — request path, limits and rollout
  description: How a checkout request is served, deployed, observed, scored and shed under load.
  body: |
    ## Request path

    A checkout request enters through the edge proxy, which terminates TLS and
    attaches a request id. The checkout service resolves the basket, prices it,
    reserves stock, and only then calls the payment service. Each hop passes the
    request id along so one trace covers the whole path.

    ## Service dependencies

    Checkout depends on catalogue for prices, inventory for stock and payment
    for authorization. Catalogue and inventory are read-only from here. A
    dependency that does not answer within its budget is treated as unavailable
    rather than retried inline, because the shopper is waiting.

    ## Timeouts and budgets

    The total budget for a checkout is four seconds. Catalogue gets 300ms,
    inventory 500ms, payment two seconds, and the remainder is our own work.
    Budgets are enforced by the client, not by the callee, so a slow dependency
    cannot spend someone else's allowance.

    ## Deployment topology

    Three regions, active-active, with the basket store replicated per region
    and payment records written to a single primary. A region can serve reads
    during a partition but refuses new authorizations, because two regions
    authorizing the same basket is worse than an outage.

    ## Configuration and secrets

    Configuration is environment variables rendered from a versioned file;
    secrets come from the vault at start-up and are never written to disk. A
    configuration change is a deploy like any other and goes through the same
    review.

    ## Observability

    Every request emits a structured log line with the request id, the merchant,
    the outcome and the duration of each dependency call. Metrics are RED —
    rate, errors, duration — per endpoint. Traces are sampled at one percent,
    and at one hundred percent for any request that ends in an error.

    ## Feature flags and rollout

    New checkout behaviour ships behind a flag, enabled first for internal
    merchants, then one percent of traffic, then ten, then everyone. A flag at
    one hundred percent for two weeks is deleted along with the branch it
    guarded. Flags are never used for access control, only for rollout.

    ## Rate limiting

    Limits are per merchant and per IP, enforced at the edge with a token
    bucket. A merchant gets 100 checkouts per second sustained and 300 burst; an
    IP gets 20 per minute. Exceeding either returns 429 with a Retry-After
    header. Limits are configuration, not code, and take effect without a deploy.

    ## Fraud scoring

    Every checkout is scored between 0 and 100 before authorization. Scores
    above 80 are declined outright, 50 to 80 are sent to manual review, and
    below 50 pass straight through. The thresholds are tuned monthly against the
    previous month's chargebacks, and a change to them is an audited decision
    rather than a config tweak. A scoring timeout fails open, because a payment
    provider will still decline a genuinely bad card.

    ## Capacity and load shedding

    The service is provisioned for twice the peak of the last Black Friday. Past
    that it sheds load rather than degrading for everyone: the edge starts
    rejecting new sessions while letting requests that already hold a payment
    reservation run to completion. Shedding is announced on the status page
    automatically, and the shed threshold is deliberately below the point where
    latency collapses, because a fast rejection is a better answer than a slow
    timeout.
  related: [arch-payment-boundaries]

- key: arch-provider-integration
  type: architecture
  title: Payment provider integration surface
  description: Everything crossing the boundary to the payment provider, and how it is kept working.
  body: |
    ## What the provider does for us

    The provider tokenizes cards, authorizes and captures payments, issues
    refunds and produces a nightly settlement file. It does not hold our order
    state, and we do not ask it to. Anything the provider knows that we also
    need is copied into our own records at the time it happens.

    ## Request shape

    Every call carries the merchant account, an idempotency key and a
    correlation id we generate. Responses are JSON with a stable envelope; the
    payload inside it varies by API version. We never parse an error string,
    only the error code.

    ## Sandbox and production environments

    The sandbox has its own credentials, its own certificate and its own webhook
    endpoint. Sandbox card numbers are documented by the provider and are the
    only cards that may appear in a test. Nothing in the codebase may branch on
    environment to decide business behaviour — only on endpoint and credentials.

    ## Provider rate limits

    The provider allows 50 requests per second per merchant account and returns
    429 beyond that. Our client holds a shared token bucket sized at 40 to leave
    headroom for retries. Batch jobs run at night and take half the bucket.

    ## Schema versioning

    The provider pins an API version per account. Upgrading is deliberate: read
    the changelog, run the sandbox suite against the new version, then flip the
    account. We are never more than two versions behind, because the provider
    supports exactly three.

    ## Outage handling

    When the provider is down, authorization fails fast and the basket is kept.
    We do not queue authorizations for later — a payment authorized an hour
    after the shopper left is a chargeback waiting to happen.

    ## Reconciliation inputs

    The nightly settlement file is fetched over SFTP at 02:00 and is the only
    input to reconciliation. If it is late we wait rather than reconcile a
    partial file, and a file that fails its checksum is never processed.

    ## Support escalation

    Provider incidents are raised through the merchant portal with the
    correlation ids of affected requests attached. Anything unresolved after two
    hours goes to the named account manager. We keep our own timeline, because
    the provider's status page has been wrong before.

    ## Credentials and certificate rotation

    We authenticate to the provider with mutual TLS. The client certificate is
    valid for one year and must be rotated at ten months, never later: the
    provider accepts both the old and the new certificate for a thirty-day
    overlap window, and that overlap is the only safe time to swap. Rotation is
    a runbook step performed by two people, not an automated job, because a
    botched rotation takes payments down entirely and cannot be rolled back
    faster than the provider propagates the change.

    ## Key custody

    The private key for that certificate lives only in the vault and is issued
    to the service at start-up. No engineer has a copy, and the certificate
    signing request is generated inside the vault so the key never leaves it.
    An expiry alarm fires ninety days out, then weekly, then daily.
  related: [arch-payment-boundaries]

- key: arch-data-lifecycle
  type: architecture
  title: Data lifecycle — retention, deletion and legal hold
  description: What each service keeps, for how long, and how a deletion or a hold is carried out.
  body: |
    ## Ownership

    Each service owns its own records and nobody reads another service's tables.
    Checkout owns baskets, payment owns authorizations and captures, analytics
    owns the event stream. A question about a record is answered by asking its
    owner, not by joining across boundaries.

    ## What each service keeps

    Checkout keeps a basket for 30 days after abandonment. The payment service
    keeps authorization and capture records for seven years, which is the tax
    retention period and is not negotiable. Analytics keeps event streams for 13
    months. Nothing keeps a card number, only a provider token.

    ## Classification

    Records are classified as identifying, financial or operational.
    Identifying data has the shortest clock and the tightest access; financial
    data has the longest clock and the widest audit; operational data is
    everything else and is kept as long as it is useful.

    ## Access control

    Reading an identifying field in production requires an approved reason and a
    time-boxed grant. Grants expire after four hours and are never renewed
    silently. Bulk export requires a second approver.

    ## Backups and restore

    Backups are nightly, encrypted, and kept for 35 days. A restore is a
    full-cluster operation; there is no per-row restore. Deletion requests are
    replayed against a restored cluster before it is put back into service,
    which is why a restore is never a fast operation.

    ## Anonymisation of analytics exports

    Exports leaving the analytics boundary carry no identifiers. Shopper ids are
    replaced with a per-export salted hash, so two exports cannot be joined.
    Free-text fields are dropped entirely rather than scrubbed, because
    scrubbing free text is not something we are willing to be confident about.

    ## Audit trail

    Every access to a payment record by a human is logged with the actor, the
    record, the time and the stated reason. The audit log is append-only, kept
    for seven years alongside the records it describes, and is itself never
    subject to an erasure request.

    ## Subject access requests

    A shopper may ask for a copy of what we hold. The response is assembled from
    each owning service, delivered within 30 days, and covers the basket
    history, the payment records and the analytics identity.

    ## Deletion requests

    A shopper's erasure request is fulfilled within 30 days. It removes the
    profile, the basket history and the analytics identity, and it replaces the
    name and address on retained payment records with a tombstone. The payment
    amounts and dates survive, because the tax obligation outlives the erasure
    right, and the tombstone records that an erasure happened so a later reader
    does not mistake the gap for corruption.

    ## Legal hold

    A legal hold freezes every record for one account, and it overrides both the
    retention clock and an erasure request. Holds are applied by the legal team
    through an audited admin action, never by an engineer with database access,
    and every hold names the matter it belongs to. Nothing under hold is deleted
    until the hold is lifted the same audited way, and the lift is itself
    recorded so the freeze has a provable start and end.
  related: [arch-payment-boundaries]
