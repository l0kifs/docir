# An example `docir bench` fixture, judged against docir's own corpus.
#
#   uv run docir bench benchmarks/example_fixture.yaml
#
# It runs against **this repository's** store, so it is a worked example rather
# than a portable benchmark: copy the shape, judge your own documents. Every
# entry is `{id, task, relevant}`, and `relevant` holds document **ids** — not
# paths, because a retitle moves the filename and a retype moves the directory,
# and a fixture has to outlive both.
#
# Judged the way tasks.yaml is: a document is relevant when *not* reading it
# would change what you write, not when it merely shares a topic. Tight
# judgments are what make precision mean anything.
#
# This fixture will rot as the corpus changes, and that is the point of the
# `unresolved` line in the output — an id no document carries is reported, never
# dropped, because dropping one shrinks recall's denominator and raises the
# score for the wrong reason.

