# Retrieval tasks for the mention-expansion measurement.
#
# Judgments follow `tasks.yaml`: a document is relevant if not reading it would
# change what you write, not merely if it shares a topic.
#
# `reachable_by` records how each relevant document is connected to the ones a
# ranked search plausibly surfaces first. It is documentation of the fixture's
# shape, not an input to scoring — the point of writing it down is that a
# benchmark built to answer "does mention expansion help" can be rigged by
# choosing only tasks it wins, and this makes the mix auditable.
#
#   ranked   — the document should be found by the ranking itself
#   related  — reachable one hop along an authored edge
#   mention  — reachable one hop along a prose citation only
#
# LIMITATION: single-annotator ground truth, authored alongside the corpus, by
# the same author as the feature under test. Weaker evidence than judgments from
# someone with no stake in the answer.

# --- the case mentions exist for: cited in prose, no authored edge ------------

