# Русский корпус для сравнения эмбеддеров (issue-a24f404dd106).
#
# A translation of `corpus.yaml`, not an independent corpus: same `key`
# handles, same `related` edges, same relevance judgments in
# `multilingual_tasks.yaml`. That is the point — the English run is the control,
# so the only variable between the two is the language of the text.
#
# LIMITATION: single-annotator, translated by the same process that wrote the
# comparison. It measures whether a model retrieves Russian documents from
# Russian tasks; it does not measure translation quality.
- key: adr-idempotency
  type: decision
  title: Ключи идемпотентности для списания платежа
  description: Каждый запрос на списание несёт сгенерированный клиентом ключ, чтобы повтор не списал деньги
    дважды.
  body: |
    Эндпоинт списания принимает заголовок `Idempotency-Key`. Первый запрос с этим ключом выполняет списание и сохраняет ответ; любой последующий запрос с тем же ключом возвращает сохранённый ответ, не обращаясь к шлюзу. Ключи действуют в пределах одного мерчанта и истекают через 24 часа.
  related: []
- key: adr-card-tokens
  type: decision
  title: Токены карт хранит провайдер, а не мы
  description: Данные карты никогда не попадают в нашу инфраструктуру; мы храним только непрозрачный токен
    провайдера.
  body: |
    Браузер обменивает реквизиты карты на токен напрямую у платёжного провайдера. Наши серверы видят только этот токен, что выводит всю платформу из области действия PCI-DSS по данным держателей карт. Ни одна колонка базы, строка лога или отчёт об ошибке не может содержать номер карты или cvv.
  related: []
- key: adr-settlement-batch
  type: decision
  title: Сверка расчётов идёт асинхронно ночным пакетом
  description: Файлы расчётов от провайдера сверяются ночью, а не в реальном времени.
  body: |
    Провайдер публикует файл расчётов раз в сутки. Ночная задача сопоставляет каждую строку расчёта с нашими списаниями и записывает результат сверки. Сверку в реальном времени отклонили: собственные цифры провайдера не окончательны, пока не придёт файл.
  related: []
- key: adr-optimistic-locking
  type: decision
  title: Оптимистичная блокировка в таблице заказов
  description: Конкурентные записи в один заказ разрешаются колонкой версии, а не блокировкой строки.
  body: |
    Каждая строка заказа несёт целочисленное поле `version`. Запись утверждает версию, которую прочитала, и увеличивает её; несовпадение означает, что кто-то успел раньше, и вызывающая сторона повторяет попытку на свежем состоянии. Пессимистичные блокировки строк отклонили, потому что оформление заказа держит заказ открытым на несколько шагов пользователя.
  related: []
- key: adr-refunds-partial
  type: decision
  title: Возвраты сначала частичные
  description: Любой возврат моделируется как частичный; полный возврат — вырожденный случай.
  body: |
    Есть один путь возврата, и он принимает сумму. Полный возврат — это просто возврат остатка, доступного к возврату. Раздельное моделирование полного и частичного возврата дало два пути кода, которые расходились в трактовке комиссий.
  related: []
- key: adr-gateway-retries
  type: decision
  title: Повтор таймаутов шлюза с экспоненциальной задержкой
  description: Вызов шлюза, завершившийся таймаутом, повторяется трижды с нарастающей задержкой.
  body: |
    Вызовы шлюза, завершившиеся таймаутом, повторяются через 1с, 4с и 16с. После третьей неудачи платёж помечается `pending_review`, а не как неуспешный, потому что таймаут неоднозначен: шлюз мог его обработать. Повторы всегда несут тот же ключ идемпотентности.
  related:
  - adr-idempotency
- key: adr-currency-rounding
  type: decision
  title: Округление к чётному до двух знаков, хранение в минорных единицах
  description: Все денежные суммы — целые числа в минорных единицах; деление округляется к чётному.
  body: |
    Суммы хранятся целыми числами в минорных единицах (копейках), а не числами с плавающей точкой. Там, где деления не избежать — например, при распределении скидки по позициям заказа — мы округляем половину к чётному, чтобы повторные разбиения не смещались вверх. Остаток относится на самую крупную позицию.
  related: []
- key: adr-webhook-hmac
  type: decision
  title: Проверка подписи вебхуков по HMAC-SHA256
  description: Входящие вебхуки провайдера аутентифицируются подписью HMAC поверх сырого тела запроса.
  body: |
    Каждый вебхук несёт заголовок с подписью, вычисленной по сырому телу запроса на общем секрете. Мы проверяем её до разбора, сравниваем за постоянное время и отклоняем всё старше пяти минут, чтобы ограничить повторную отправку.
  related: []
- key: adr-dlq-manual
  type: decision
  title: Повтор из очереди недоставленных — ручной и аудируемый
  description: Сообщения из очереди недоставленных никогда не повторяются автоматически.
  body: |
    Сообщение, попавшее в очередь недоставленных, уже исчерпало свои повторы, поэтому автоматический повтор обычно воспроизводит сбой в объёме. Повтор — явное действие оператора, записанное с указанием, кто и почему его сделал.
  related: []
- key: adr-order-state-machine
  type: decision
  title: Заказы движутся по явному конечному автомату
  description: Переходы статуса заказа объявлены заранее; недопустимые переходы отклоняются.
  body: |
    Заказ находится в одном из состояний: ожидает, авторизован, списан, рассчитан, возвращён или отменён, а допустимые переходы объявлены в одной таблице. Всё остальное отклоняется при записи, а не обнаруживается позже в отчёте.
  related: []
- key: issue-duplicate-charges
  type: issue
  title: Двойное списание, когда покупатель дважды нажимает «оплатить»
  description: Нетерпеливые покупатели, нажимая «оплатить» дважды, получают два списания по одному заказу.
  body: |
    Поддержка видела покупателей, с которых списали дважды после повторных нажатий на кнопку оплаты при медленном соединении. Оба запроса доходят до эндпоинта списания раньше, чем вернётся первый ответ, и оба проходят успешно.
  related:
  - adr-idempotency
- key: issue-settlement-drift
  type: issue
  title: Итоги отчёта о расчётах расходятся на несколько копеек
  description: Наш сверенный итог и файл расчётов провайдера расходятся на небольшие суммы.
  body: |
    Ночная сверка показывает итог на несколько копеек ниже цифры провайдера в дни с большим числом многопозиционных заказов со скидкой. Расхождение растёт с числом разбитых скидок.
  related:
  - adr-currency-rounding
- key: issue-refund-archived
  type: issue
  title: Возврат не проходит, если заказ архивирован
  description: Возврат по архивированному заказу возвращает ошибку «не найдено» вместо возврата средств.
  body: |
    Заказы, архивированные задачей обслуживания, исключены из выборки заказов по умолчанию, поэтому эндпоинт возврата их не находит и отдаёт 404, хотя платёж прекрасно поддаётся возврату.
  related:
  - adr-refunds-partial
- key: issue-webhook-flood
  type: issue
  title: Повторная отправка вебхуков заливает очередь после сбоя у провайдера
  description: Восстановившись, провайдер за раз досылает вебхуки за несколько часов, и очередь копится.
  body: |
    После четырёхчасового сбоя провайдер за несколько минут доставил заново все пропущенные вебхуки. Наши потребители отстали, задержка обработки дошла до двадцати минут, и несколько сообщений попали в очередь недоставленных.
  related:
  - adr-webhook-hmac
  - adr-dlq-manual
- key: issue-checkout-timeout
  type: issue
  title: Оформление заказа отваливается по таймауту под пиковой нагрузкой
  description: Задержка оформления превышает таймаут шлюза во время пиков трафика.
  body: |
    Во время последней распродажи задержка оформления на p99 превысила десятисекундный таймаут шлюза. Платежи, которые на самом деле прошли, показывались покупателю как неуспешные.
  related:
  - adr-gateway-retries
- key: issue-stale-order-status
  type: issue
  title: Покупатель видит устаревший статус заказа после оплаты
  description: Страница подтверждения несколько секунд показывает статус до оплаты.
  body: |
    Два запроса обновляют один заказ примерно в один момент — обратный вызов о списании и обновление страницы покупателем — и более поздняя запись иногда затирает более новый статус старым.
  related:
  - adr-optimistic-locking
- key: issue-reconciliation-oom
  type: issue
  title: Задача сверки исчерпывает память на больших пакетах
  description: Ночная задача загружает весь файл расчётов в память и умирает в большие дни.
  body: |
    Задача читает файл расчётов целиком в список перед сопоставлением. В дни большого объёма файл превышает доступную память, задачу убивают, и день остаётся несверенным.
  related:
  - adr-settlement-batch
- key: adr-sessions-redis
  type: decision
  title: Сессии оформления заказа держим в Redis
  description: Незавершённое оформление хранится в Redis по ключу сессии тридцать минут.
  body: |
    Незавершённое оформление покупателя — выбранные товары, адрес, выбранный способ оплаты — живёт в Redis под идентификатором сессии с TTL в тридцать минут. Перезапуск веб-слоя поэтому никому не стоит корзины, и состояние оформления не касается основной базы на горячем пути.
  related:
  - issue-session-loss
- key: adr-sessions-postgres
  type: decision
  title: Долговременное состояние пользователя переезжает в Postgres
  description: Долгоживущее состояние покупателя пишется в Postgres, а не в кэш с истечением.
  body: |
    Всё, что покупатель ожидает увидеть снова — корзина, оставленная вчера, сохранённый адрес доставки, брошенный заказ, о котором мы собираемся написать — пишется в долговременные строки. Изменчивое пространство ключей с TTL — неподходящий дом для состояния, которое человек считает сохранённым.
  related:
  - adr-sessions-redis:supersedes
- key: issue-session-loss
  type: issue
  title: Корзины исчезают при сбросе кэша
  description: Сброс кэша во время выкладки опустошает все незавершённые корзины.
  body: |
    Сброс кэша посреди выкладки уронил все незавершённые оформления, и покупатели в процессе оплаты увидели пустую корзину. Починили, добавив слив перед сбросом; выбор хранилища тогда не пересматривали.
  related: []
- key: arch-payment-boundaries
  type: architecture
  title: Границы платёжного сервиса и владение данными
  description: Какой сервис владеет заказами, платежами и записями расчётов, и кому что можно читать.
  body: |
    Сервис заказов владеет состоянием заказа. Платёжный сервис владеет авторизациями, списаниями и возвратами и является единственным писателем платёжных записей. Записями расчётов владеет сервис сверки. Ни один сервис не читает таблицы другого напрямую.
  related: []
- key: arch-payment-events
  type: architecture
  title: Поток платёжных событий от размещения до расчёта
  description: Сквозная последовательность событий, которые порождает заказ, и кто потребляет каждое.
  body: |
    OrderPlaced приводит к PaymentAuthorized, затем PaymentCaptured, затем PaymentSettled, когда сверка сопоставит файл провайдера. Каждое событие публикуется один раз и потребляется сервисами уведомлений и аналитики.
  related:
  - arch-payment-boundaries
  - adr-order-state-machine
- key: arch-queue-topology
  type: architecture
  title: Топология очередей и обработка недоставленных
  description: Как связаны рабочие очереди, повторы и очереди недоставленных в платёжных сервисах.
  body: |
    У каждого потребителя есть основная очередь и очередь недоставленных. Сообщение трижды повторяется на месте, затем перемещается в очередь недоставленных с приложенной причиной сбоя. За очередями недоставленных следят, но никогда не разгребают автоматически.
  related:
  - adr-dlq-manual
- key: arch-checkout-runtime
  type: architecture
  title: Среда выполнения оформления — путь запроса, лимиты и раскатка
  description: Как обслуживается запрос на оформление, как он выкладывается, наблюдается, оценивается
    и сбрасывается под нагрузкой.
  body: |
    ## Путь запроса
    Запрос на оформление входит через пограничный прокси, который терминирует TLS и присваивает идентификатор запроса. Сервис оформления разрешает корзину, считает цену, резервирует остаток и только потом вызывает платёжный сервис. Каждый переход передаёт идентификатор запроса дальше, так что одна трасса покрывает весь путь.

    ## Зависимости сервиса
    Оформление зависит от каталога по ценам, от склада по остаткам и от платежей по авторизации. Каталог и склад отсюда только читаются. Зависимость, не ответившая в свой бюджет, считается недоступной, а не повторяется на месте, потому что покупатель ждёт.

    ## Таймауты и бюджеты
    Общий бюджет оформления — четыре секунды. Каталогу отводится 300 мс, складу 500 мс, платежам две секунды, остаток — наша собственная работа. Бюджеты навязывает клиент, а не вызываемая сторона, чтобы медленная зависимость не тратила чужую долю.

    ## Топология развёртывания
    Три региона, active-active, хранилище корзин реплицировано по регионам, платёжные записи пишутся в единственный первичный узел. Регион может обслуживать чтения при разделении сети, но отказывает в новых авторизациях, потому что две авторизации одной корзины хуже, чем недоступность.

    ## Конфигурация и секреты
    Конфигурация — переменные окружения, порождённые из версионируемого файла; секреты приходят из хранилища при старте и никогда не пишутся на диск. Изменение конфигурации — такая же выкладка и проходит то же ревью.

    ## Наблюдаемость
    Каждый запрос порождает структурированную строку лога с идентификатором запроса, мерчантом, исходом и длительностью каждого вызова зависимости. Метрики — RED: частота, ошибки, длительность — по каждому эндпоинту. Трассы семплируются на одном проценте и на ста процентах для любого запроса, закончившегося ошибкой.

    ## Флаги функций и раскатка
    Новое поведение оформления выходит за флагом: сначала для внутренних мерчантов, потом на один процент трафика, потом на десять, потом на всех. Флаг, простоявший на ста процентах две недели, удаляется вместе с веткой, которую он прикрывал. Флаги никогда не используются для контроля доступа, только для раскатки.

    ## Ограничение частоты
    Лимиты действуют на мерчанта и на IP и навязываются на границе алгоритмом «ведро с токенами». Мерчант получает 100 оформлений в секунду в устойчивом режиме и 300 на всплеске; IP — 20 в минуту. Превышение любого возвращает 429 с заголовком Retry-After. Лимиты — конфигурация, а не код, и вступают в силу без выкладки.

    ## Скоринг мошенничества
    Каждое оформление получает оценку от 0 до 100 до авторизации. Оценки выше 80 отклоняются сразу, от 50 до 80 уходят на ручную проверку, ниже 50 проходят насквозь. Пороги настраиваются ежемесячно по чарджбэкам предыдущего месяца, и их изменение — аудируемое решение, а не правка конфигурации. Таймаут скоринга трактуется в пользу пропуска, потому что платёжный провайдер всё равно отклонит по-настоящему плохую карту.

    ## Запас мощности и сброс нагрузки
    Сервис рассчитан на двойной пик прошлой «чёрной пятницы». Дальше он сбрасывает нагрузку, а не деградирует для всех: граница начинает отклонять новые сессии, позволяя запросам, уже удерживающим платёжный резерв, доработать до конца. О сбросе автоматически сообщается на странице статуса, и порог сброса намеренно ниже точки, где задержка обваливается, потому что быстрый отказ — лучший ответ, чем медленный таймаут.
  related:
  - arch-payment-boundaries
- key: arch-provider-integration
  type: architecture
  title: Поверхность интеграции с платёжным провайдером
  description: Всё, что пересекает границу с платёжным провайдером, и как это поддерживается в рабочем
    состоянии.
  body: |
    ## Что провайдер делает за нас
    Провайдер токенизирует карты, авторизует и списывает платежи, оформляет возвраты и готовит ночной файл расчётов. Он не хранит состояние наших заказов, и мы его об этом не просим. Всё, что знает провайдер и что нужно нам, копируется в наши собственные записи в момент, когда это происходит.

    ## Форма запроса
    Каждый вызов несёт счёт мерчанта, ключ идемпотентности и сгенерированный нами идентификатор корреляции. Ответы — JSON со стабильной оболочкой; содержимое внутри зависит от версии API. Мы никогда не разбираем текст ошибки, только её код.

    ## Песочница и продуктивная среда
    У песочницы свои учётные данные, свой сертификат и свой адрес вебхуков. Номера карт песочницы описаны провайдером и являются единственными картами, которые могут появиться в тесте. Ничто в коде не может ветвиться по среде, решая бизнес-поведение, — только по адресу и учётным данным.

    ## Лимиты провайдера
    Провайдер допускает 50 запросов в секунду на счёт мерчанта и возвращает 429 сверх этого. Наш клиент держит общее «ведро с токенами» размером 40, оставляя запас на повторы. Пакетные задачи идут ночью и забирают половину ведра.

    ## Версионирование схемы
    Провайдер закрепляет версию API за счётом. Обновление делается осознанно: прочитать список изменений, прогнать набор тестов в песочнице на новой версии, затем переключить счёт. Мы никогда не отстаём больше чем на две версии, потому что провайдер поддерживает ровно три.

    ## Поведение при сбое провайдера
    Когда провайдер недоступен, авторизация падает быстро, а корзина сохраняется. Мы не ставим авторизации в очередь на потом: платёж, авторизованный через час после ухода покупателя, — это будущий чарджбэк.

    ## Входные данные сверки
    Ночной файл расчётов забирается по SFTP в 02:00 и является единственным входом сверки. Если он опаздывает, мы ждём, а не сверяем неполный файл, а файл, не прошедший контрольную сумму, не обрабатывается никогда.

    ## Эскалация в поддержку
    Инциденты провайдера заводятся через портал мерчанта с приложенными идентификаторами корреляции затронутых запросов. Всё нерешённое через два часа уходит именованному менеджеру счёта. Мы ведём собственную хронологию, потому что страница статуса провайдера уже ошибалась.

    ## Учётные данные и ротация сертификата
    Мы аутентифицируемся у провайдера по взаимному TLS. Клиентский сертификат действует год и должен быть заменён на десятом месяце, не позже: провайдер принимает и старый, и новый сертификат в течение тридцатидневного окна перекрытия, и это перекрытие — единственное безопасное время для замены. Ротация — шаг runbook, выполняемый двумя людьми, а не автоматической задачей, потому что сорванная ротация полностью останавливает платежи и не откатывается быстрее, чем провайдер распространит изменение.

    ## Хранение ключа
    Приватный ключ к этому сертификату живёт только в хранилище секретов и выдаётся сервису при старте. Ни у одного инженера нет копии, а запрос на подпись сертификата формируется внутри хранилища, так что ключ его не покидает. Сигнал об истечении срабатывает за девяносто дней, затем еженедельно, затем ежедневно.
