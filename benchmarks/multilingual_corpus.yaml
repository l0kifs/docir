- key: arch-data-lifecycle
  type: architecture
  title: Жизненный цикл данных — хранение, удаление и юридическая заморозка
  description: Что каждый сервис хранит, как долго, и как исполняются удаление или заморозка.
  body: |
    ## Владение
    Каждый сервис владеет своими записями, и никто не читает таблицы другого сервиса. Оформление владеет корзинами, платежи — авторизациями и списаниями, аналитика — потоком событий. Вопрос о записи решается обращением к её владельцу, а не соединением через границы.

    ## Что и сколько хранит каждый сервис
    Оформление хранит корзину 30 дней после того, как её бросили. Платёжный сервис хранит записи авторизаций и списаний семь лет — это налоговый срок хранения, и он не обсуждается. Аналитика хранит потоки событий 13 месяцев. Номер карты не хранит никто, только токен провайдера.

    ## Классификация
    Записи классифицируются как идентифицирующие, финансовые или операционные. У идентифицирующих данных самый короткий срок и самый строгий доступ; у финансовых самый долгий срок и самый широкий аудит; операционные — всё остальное, и хранятся, пока полезны.

    ## Контроль доступа
    Чтение идентифицирующего поля в продуктивной среде требует одобренной причины и выдачи доступа на ограниченный срок. Выдача истекает через четыре часа и никогда не продлевается молча. Массовая выгрузка требует второго согласующего.

    ## Резервные копии и восстановление
    Резервные копии — ночные, зашифрованные, хранятся 35 дней. Восстановление — операция на весь кластер; восстановления отдельной строки не существует. Запросы на удаление проигрываются на восстановленном кластере до того, как он вернётся в работу, и поэтому восстановление никогда не бывает быстрым.

    ## Обезличивание аналитических выгрузок
    Выгрузки, покидающие границу аналитики, не несут идентификаторов. Идентификаторы покупателей заменяются солёным хэшем, своим для каждой выгрузки, так что две выгрузки нельзя соединить. Поля свободного текста удаляются целиком, а не очищаются, потому что в очистке свободного текста мы не готовы быть уверены.

    ## Журнал аудита
    Каждое обращение человека к платёжной записи журналируется с указанием действующего лица, записи, времени и заявленной причины. Журнал аудита только дополняется, хранится семь лет рядом с записями, которые описывает, и сам никогда не подлежит запросу на стирание.

    ## Запросы на доступ к своим данным
    Покупатель может запросить копию того, что мы о нём храним. Ответ собирается из каждого владеющего сервиса, выдаётся в течение 30 дней и охватывает историю корзин, платёжные записи и аналитическую идентичность.

    ## Запросы на удаление
    Запрос покупателя на стирание исполняется в течение 30 дней. Он удаляет профиль, историю корзин и аналитическую идентичность, а имя и адрес в сохраняемых платёжных записях заменяет надгробной записью. Суммы и даты платежей остаются, потому что налоговая обязанность переживает право на стирание, а надгробная запись фиксирует, что стирание было, чтобы поздний читатель не принял пробел за повреждение данных.

    ## Юридическая заморозка
    Юридическая заморозка замораживает все записи по одному счёту и перекрывает и срок хранения, и запрос на стирание. Заморозки накладывает юридическая служба аудируемым административным действием, а не инженер с доступом к базе, и каждая заморозка называет дело, к которому относится. Ничто под заморозкой не удаляется, пока заморозка не снята тем же аудируемым способом, и снятие тоже записывается, так что у заморозки есть доказуемые начало и конец.
