# Retrieval tasks with relevance judgments.
#
# `relevant` lists the corpus keys a reader would need to see before starting the
# task. Judgments are deliberately tight: a document is relevant if not reading it
# would change what you write, not merely if it shares a topic.
#
# `lexical: true`  — the task wording overlaps the corpus vocabulary. Full-text
#                    search should do well; this is the easy half.
# `lexical: false` — the task is phrased the way a person actually asks, using
#                    none of the corpus's terms. Only a model that captures
#                    meaning can retrieve these; a lexical matcher must miss them.
#
# LIMITATION: single-annotator ground truth, authored alongside the corpus.
# It measures whether retrieval finds what its author considers relevant, which
# is weaker evidence than judgments from someone who did not write the corpus.

- id: T01
