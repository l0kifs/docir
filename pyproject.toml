[project]
name = "docir"
version = "0.13.1"
description = "Compiles git-backed markdown into a verifiable, read-optimized index for AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sergei Konovalov" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "adr",
    "architecture-decision-records",
    "documentation-as-code",
    "rag",
    "semantic-search",
    "knowledge-management",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    # Real ONNX semantic embeddings, on by default. Was optional, which meant the
    # shipped default scored similarity by shared vocabulary rather than meaning
    # -- `docir context` measured no better than plain full-text search (see
    # benchmarks/). Set DOCIR_EMBEDDER=deterministic for the dependency-free
    # hashing embedder; the test suite does.
    "fastembed>=0.5",
    # The MCP server (ADR-0013). Also shipped by default rather than behind an
    # extra: an agent that only speaks MCP cannot install the extra it would
    # need, because it cannot reach docir to be told about it. ~12 MB against
    # onnxruntime's 68 MB, and `entry_points/mcp/cmds.py` still imports it
    # lazily so no other command pays its ~0.3s import.
    "fastmcp>=3.4",
    # Filesystem notifications for the daemon's docs watcher. Already arrived
    # transitively with fastmcp; declared because depending on someone else's
    # transitive dependency is depending on their next release notes.
    "watchfiles>=1.0",
    # Markdown -> HTML for `docir build`. Already arrived transitively via rich;
    # declared for the same reason watchfiles is.
    "markdown-it-py>=3.0",
    # PEP 440 version ordering for the release check. Hand-rolling it is how you
    # decide 0.9.0 is newer than 0.10.0; it already arrives transitively, and
    # depending on someone else's transitive dependency is depending on their
    # next release notes.
    "packaging>=24.0",
]

# The sidebar every PyPI visitor scans. Absent, the page linked nowhere at all:
# not to the source, not to the published corpus docir builds from itself.
[project.urls]
Homepage = "https://github.com/l0kifs/docir"
Documentation = "https://l0kifs.github.io/docir/index.html"
Repository = "https://github.com/l0kifs/docir"
Changelog = "https://github.com/l0kifs/docir/blob/main/CHANGELOG.md"
Issues = "https://github.com/l0kifs/docir/issues"

[project.scripts]
docir = "docir.entry_points.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "tach>=0.35.0",
    "ty>=0.0.1a1",
    "vulture>=2.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "docir"
module-root = "src"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (refined against docs.astral.sh/ruff)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations", "src/docir/platform/persistence/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["N802", "N803", "S101"]
# Captured terminal output, 132 columns wide because a terminal is.
"scripts/make_demo_svg.py" = ["E501"]

# ---------------------------------------------------------------------------
# ty — Astral type checker (refined against docs.astral.sh/ty)
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
output-format = "concise"

# ---------------------------------------------------------------------------
# Vulture — dead-code finder
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["src"]
min_confidence = 70
exclude = ["*/alembic/*"]
ignore_decorators = [
    "@app.command",
    "@app.callback",
    "@tag_app.command",
    "@daemon_app.command",
    "@agent_app.command",
]

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: spawns a real subprocess or loads the real embedding model"]

[tool.coverage.run]
source = ["docir"]
branch = true
omit = [
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
