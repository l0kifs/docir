[project]
name = "docir"
version = "0.8.0"
description = "Doc-Index CLI — git-backed markdown documents with a derived SQLite/FTS5/semantic index, served by a warm local daemon."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sergei Konovalov" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    # Real ONNX semantic embeddings, on by default. Was optional, which meant the
    # shipped default scored similarity by shared vocabulary rather than meaning
    # -- `docir context` measured no better than plain full-text search (see
    # benchmarks/). Set DOCIR_EMBEDDER=deterministic for the dependency-free
    # hashing embedder; the test suite does.
    "fastembed>=0.5",
]

[project.optional-dependencies]
# Retained so `pip install docir[embeddings]` keeps working; fastembed is now a
# hard dependency, so this extra adds nothing.
embeddings = ["fastembed>=0.5"]

[project.scripts]
docir = "docir.entry_points.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "tach>=0.35.0",
    "ty>=0.0.1a1",
    "vulture>=2.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "docir"
module-root = "src"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (refined against docs.astral.sh/ruff)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations", "src/docir/platform/persistence/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["N802", "N803", "S101"]

# ---------------------------------------------------------------------------
# ty — Astral type checker (refined against docs.astral.sh/ty)
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
output-format = "concise"

# ---------------------------------------------------------------------------
# Vulture — dead-code finder
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["src"]
min_confidence = 70
exclude = ["*/alembic/*"]
ignore_decorators = [
    "@app.command",
    "@app.callback",
    "@tag_app.command",
    "@daemon_app.command",
    "@agent_app.command",
]

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: spawns a real subprocess or loads the real embedding model"]

[tool.coverage.run]
source = ["docir"]
branch = true
omit = [
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
